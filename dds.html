
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#f0f2f5;--white:#ffffff;--surface:#f8f9fb;
--blue:#1a56db;--blue-light:#e8f0fe;--blue-dark:#1241a8;
--green:#057a55;--green-light:#def7ec;
--red:#c81e1e;--red-light:#fde8e8;
--yellow:#723b13;--yellow-light:#feecdc;
--gray1:#111928;--gray2:#374151;--gray3:#6b7280;--gray4:#9ca3af;--gray5:#d1d5db;--gray6:#e5e7eb;--gray7:#f3f4f6;
--r:10px;--r2:6px;
--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--gray1);min-height:600px;display:flex;flex-direction:column}
.topbar{background:var(--gray1);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;flex-shrink:0}
.topbar-brand{display:flex;align-items:center;gap:9px}
.brand-dot{width:26px;height:26px;background:var(--blue);border-radius:6px;display:flex;align-items:center;justify-content:center}
.brand-dot i{font-size:15px;color:#fff}
.brand-name{font-size:14px;font-weight:600;color:#fff;letter-spacing:-.2px}
.topbar-right{display:flex;align-items:center;gap:10px}
.top-user{font-size:12px;color:#9ca3af;display:flex;align-items:center;gap:7px}
.top-user strong{color:#e5e7eb}
.btn-top{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:5px;padding:5px 11px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;color:#e5e7eb;cursor:pointer;display:flex;align-items:center;gap:5px;transition:background .15s}
.btn-top:hover{background:rgba(255,255,255,.18)}
.main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px 40px}
.wrap{width:100%;max-width:500px}
.wrap-wide{width:100%;max-width:820px}
.card{background:var(--white);border:1px solid var(--gray6);border-radius:var(--r);box-shadow:var(--shadow)}
.card-hd{padding:16px 20px;border-bottom:1px solid var(--gray6);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:600;color:var(--gray1);display:flex;align-items:center;gap:7px}
.card-title i{font-size:16px;color:var(--blue)}
.card-body{padding:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:500;color:var(--gray3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select{width:100%;background:var(--gray7);border:1px solid var(--gray5);border-radius:var(--r2);padding:9px 13px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:var(--gray1);outline:none;transition:border .15s,box-shadow .15s}
.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.1);background:#fff}
.field select option{background:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border:none;border-radius:var(--r2);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dark)}
.btn-ghost{background:transparent;border:1px solid var(--gray5);color:var(--gray2)}
.btn-ghost:hover{background:var(--gray7);border-color:var(--gray4)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:#046c4e}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
.screen{animation:up .2s ease}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.tabs{display:flex;border-bottom:1px solid var(--gray6);padding:0 20px}
.tab{padding:11px 14px;font-size:13px;font-weight:500;color:var(--gray4);border-bottom:2px solid transparent;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;font-family:'IBM Plex Sans',sans-serif;transition:all .15s}
.tab:hover{color:var(--gray2)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px}
.badge-blue{background:var(--blue-light);color:var(--blue-dark)}
.badge-green{background:var(--green-light);color:var(--green)}
.badge-red{background:var(--red-light);color:var(--red)}
.alert{padding:10px 13px;border-radius:var(--r2);font-size:13px;display:flex;align-items:flex-start;gap:7px;line-height:1.5}
.alert i{font-size:14px;flex-shrink:0;margin-top:1px}
.alert-success{background:var(--green-light);color:var(--green);border:1px solid #a7f3d0}
.alert-error{background:var(--red-light);color:var(--red);border:1px solid #fca5a5}
.alert-info{background:var(--blue-light);color:var(--blue-dark);border:1px solid #bfdbfe}
.alert-warn{background:var(--yellow-light);color:var(--yellow);border:1px solid #fcd34d}
.prog-wrap{margin-bottom:18px}
.prog-info{display:flex;justify-content:space-between;font-size:12px;color:var(--gray3);margin-bottom:5px}
.prog-track{height:5px;background:var(--gray6);border-radius:3px}
.prog-fill{height:100%;background:var(--blue);border-radius:3px;transition:width .3s}
.q-num{font-size:11px;font-weight:500;color:var(--gray4);text-transform:uppercase;letter-spacing:.5px;font-family:'IBM Plex Mono',monospace;margin-bottom:5px}
.q-text{font-size:15px;font-weight:500;color:var(--gray1);line-height:1.55;margin-bottom:14px}
.opt{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1.5px solid var(--gray5);border-radius:var(--r2);margin-bottom:7px;cursor:pointer;transition:all .15s;background:#fff}
.opt:hover{border-color:var(--blue);background:var(--blue-light)}
.opt.selected{border-color:var(--blue);background:var(--blue-light)}
.opt.correct{border-color:var(--green)!important;background:var(--green-light)!important}
.opt.wrong{border-color:var(--red)!important;background:var(--red-light)!important}
.opt-key{width:26px;height:26px;border-radius:5px;background:var(--gray6);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--gray3);flex-shrink:0;transition:all .15s;font-family:'IBM Plex Mono',monospace}
.opt.selected .opt-key{background:var(--blue);color:#fff}
.opt.correct .opt-key{background:var(--green);color:#fff}
.opt.wrong .opt-key{background:var(--red);color:#fff}
.opt-text{font-size:13px;color:var(--gray2);line-height:1.4}
.q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--gray6)}
.qmap{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.qmap-dot{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;font-family:'IBM Plex Mono',monospace}
.result-hero{text-align:center;padding:28px 20px}
.result-ring{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:24px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.result-ring.ok{background:var(--green-light);color:var(--green);border:3px solid #6ee7b7}
.result-ring.fail{background:var(--red-light);color:var(--red);border:3px solid #fca5a5}
.result-label{font-size:20px;font-weight:600;margin-bottom:5px}
.result-label.ok{color:var(--green)}
.result-label.fail{color:var(--red)}
.result-sub{font-size:13px;color:var(--gray3);margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto 20px}
.stat{background:var(--gray7);border-radius:var(--r2);padding:12px;text-align:center}
.stat-num{font-size:22px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.stat-lbl{font-size:10px;color:var(--gray3);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.q-block{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--gray6)}
.q-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.login-top{text-align:center;padding:28px 20px 4px}
.login-icon{width:52px;height:52px;background:var(--blue);border-radius:13px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.login-icon i{font-size:26px;color:#fff}
.login-top h2{font-size:19px;font-weight:600;margin-bottom:3px}
.login-top p{font-size:13px;color:var(--gray3)}
.url-box{background:var(--gray7);border:1px solid var(--gray6);border-radius:var(--r2);padding:13px;margin-bottom:14px}
.url-box p{font-size:12px;color:var(--gray3);margin-bottom:8px;line-height:1.5}
.url-row{display:flex;gap:0}
.url-row input{border-radius:var(--r2) 0 0 var(--r2)!important;flex:1}
.url-row .btn{border-radius:0 var(--r2) var(--r2) 0!important}
.sep{border:none;border-top:1px solid var(--gray6);margin:14px 0}
</style>

<div id="app">
  <div class="topbar">
    <div class="topbar-brand">
      <div class="brand-dot"><i class="ti ti-shield-check" aria-hidden="true"></i></div>
      <span class="brand-name">DDS Sistema</span>
    </div>
    <div class="topbar-right" id="top-right"></div>
  </div>
  <div class="main" id="main"></div>
</div>

<script>
const DEFAULT_URL='https://script.google.com/macros/s/AKfycbzUtVKwS65dSO2LyGuXUHD-qz-rZsy4tauAaoYruHOlQ-DSbGwQZufnjjcFjLvVwTHuAQ/exec';
let SURL=DEFAULT_URL;
let user=null;
let perguntas=[];
let respostas={};
let qIdx=0;
let ended=false;

try{const s=localStorage.getItem('dds_url2');if(s)SURL=s;}catch(e){}

const $=id=>document.getElementById(id);
const main=()=>$('main');
const topR=()=>$('top-right');

function setTop(u){
  if(!u){topR().innerHTML='';return;}
  const isA=u==='admin';
  topR().innerHTML=`
    <div class="top-user">
      <i class="ti ti-user-circle" style="font-size:17px" aria-hidden="true"></i>
      <strong>${isA?'Administrador':u.nome}</strong>
      ${!isA&&u.setor?`<span class="badge badge-blue">${u.setor}</span>`:''}
    </div>
    <button class="btn-top" onclick="logout()"><i class="ti ti-logout" aria-hidden="true"></i> Sair</button>`;
}

function showLogin(){
  setTop(null);
  main().innerHTML=`
  <div class="wrap screen">
    <div class="card">
      <div class="login-top">
        <div class="login-icon"><i class="ti ti-shield-check" aria-hidden="true"></i></div>
        <h2>Diálogo Diário de Segurança</h2>
        <p>Acesse com seu CPF e senha</p>
      </div>
      <div class="card-body">
        <div class="url-box">
          <p><i class="ti ti-link" style="vertical-align:-2px;margin-right:3px" aria-hidden="true"></i><strong>URL do Apps Script</strong> — já configurada, altere se necessário</p>
          <div class="url-row">
            <input id="inp-url" value="${SURL}" placeholder="https://script.google.com/macros/s/..."/>
            <button class="btn btn-primary" onclick="saveURL()">Salvar</button>
          </div>
          <div id="url-msg" style="margin-top:8px"></div>
        </div>
        <div class="field"><label>CPF ou usuário</label><input id="inp-u" placeholder="Digite seu CPF"/></div>
        <div class="field"><label>Senha</label><input id="inp-p" type="password" placeholder="Digite sua senha" onkeydown="if(event.key==='Enter')login()"/></div>
        <div id="lmsg" style="margin-bottom:12px"></div>
        <button class="btn btn-primary btn-block" onclick="login()"><i class="ti ti-login" aria-hidden="true"></i> Entrar</button>
      </div>
    </div>
  </div>`;
}

function saveURL(){
  const v=$('inp-url').value.trim();
  const m=$('url-msg');
  if(!v.startsWith('https://')){m.innerHTML='<div class="alert alert-error"><i class="ti ti-alert-circle"></i>URL inválida.</div>';return;}
  SURL=v;try{localStorage.setItem('dds_url2',v);}catch(e){}
  m.innerHTML='<div class="alert alert-success"><i class="ti ti-check"></i>URL salva!</div>';
  setTimeout(()=>{if($('url-msg'))$('url-msg').innerHTML='';},2500);
}

async function login(){
  const u=$('inp-u').value.trim();
  const p=$('inp-p').value.trim();
  const m=$('lmsg');
  if(!u||!p){m.innerHTML='<div class="alert alert-warn"><i class="ti ti-alert-triangle"></i>Preencha CPF e senha.</div>';return;}
  if(u==='admin'&&p==='admin123'){user='admin';setTop('admin');showAdmin();return;}
  m.innerHTML='<div class="alert alert-info"><i class="ti ti-loader"></i>Verificando...</div>';
  try{
    const r=await fetch(SURL+'?usuarios=1');
    if(!r.ok)throw new Error('Erro HTTP '+r.status+'. Verifique se o script está publicado como "Qualquer pessoa".');
    const data=await r.json();
    const clean=s=>String(s||'').replace(/\D/g,'');
    const found=data.find(x=>clean(x.cpf)===clean(u)&&clean(x.senha)===clean(p));
    if(found){user=found;setTop(found);showQuiz();}
    else m.innerHTML='<div class="alert alert-error"><i class="ti ti-alert-circle"></i>CPF ou senha inválidos.</div>';
  }catch(e){
    m.innerHTML=`<div class="alert alert-error"><i class="ti ti-alert-circle"></i>${e.message}</div>`;
  }
}

function logout(){user=null;perguntas=[];respostas={};qIdx=0;ended=false;showLogin();}

/* ---- ADMIN ---- */
function showAdmin(){
  main().innerHTML=`
  <div class="wrap-wide screen">
    <div class="card">
      <div class="tabs">
        <button class="tab active" id="tab-u" onclick="atab('u')"><i class="ti ti-users" aria-hidden="true"></i> Usuários</button>
        <button class="tab" id="tab-p" onclick="atab('p')"><i class="ti ti-help-circle" aria-hidden="true"></i> Perguntas</button>
      </div>
      <div id="abody" class="card-body"></div>
    </div>
  </div>`;
  atab('u');
}

function atab(t){
  ['u','p'].forEach(x=>$('tab-'+x).classList.toggle('active',x===t));
  const b=$('abody');
  if(t==='u'){
    b.innerHTML=`
      <p style="font-size:13px;color:var(--gray3);margin-bottom:16px">A senha do funcionário será o próprio CPF (sem pontuação).</p>
      <div class="field"><label>Nome completo</label><input id="u-n" placeholder="Ex: João da Silva"/></div>
      <div class="row2">
        <div class="field"><label>CPF <span style="color:var(--gray4);font-size:10px">(será a senha)</span></label><input id="u-c" placeholder="000.000.000-00"/></div>
        <div class="field"><label>Setor</label><input id="u-s" placeholder="Ex: Produção"/></div>
      </div>
      <div id="umsg" style="margin-bottom:10px"></div>
      <button class="btn btn-primary" onclick="cadUser()"><i class="ti ti-user-plus" aria-hidden="true"></i> Salvar Usuário</button>`;
  }else{
    b.innerHTML=`
      <div class="row2">
        <div class="field"><label>Setor alvo <span style="color:var(--gray4);font-size:10px">(vazio = todos)</span></label><input id="p-s" placeholder="Ex: Produção"/></div>
        <div class="field"><label>Tema DDS</label><input id="p-d" placeholder="Ex: Uso de EPI"/></div>
      </div>
      <div class="field"><label>Pergunta</label><input id="p-t" placeholder="Digite a pergunta completa aqui"/></div>
      <div class="row2">
        <div class="field"><label>Alternativa A</label><input id="p-a" placeholder="Opção A"/></div>
        <div class="field"><label>Alternativa B</label><input id="p-b" placeholder="Opção B"/></div>
      </div>
      <div class="row2">
        <div class="field"><label>Alternativa C</label><input id="p-c" placeholder="Opção C (opcional)"/></div>
        <div class="field"><label>Alternativa D</label><input id="p-d2" placeholder="Opção D (opcional)"/></div>
      </div>
      <div class="field"><label>Resposta correta</label>
        <select id="p-r"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
      </div>
      <div id="pmsg" style="margin-bottom:10px"></div>
      <button class="btn btn-primary" onclick="cadPerg()"><i class="ti ti-check" aria-hidden="true"></i> Salvar Pergunta</button>`;
  }
}

function gv(id){const el=$(id);return el?el.value.trim():'';}

async function postData(payload,msgId){
  const m=$(msgId);
  m.innerHTML='<div class="alert alert-info"><i class="ti ti-loader"></i>Salvando...</div>';
  try{
    await fetch(SURL,{
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify(payload)
    });
    m.innerHTML='<div class="alert alert-success"><i class="ti ti-check"></i>Salvo com sucesso!</div>';
    setTimeout(()=>{if($(msgId))$(msgId).innerHTML='';},3000);
    return true;
  }catch(e){
    m.innerHTML=`<div class="alert alert-error"><i class="ti ti-alert-circle"></i>Erro: ${e.message}</div>`;
    return false;
  }
}

async function cadUser(){
  const n=gv('u-n'),c=gv('u-c'),s=gv('u-s');
  if(!n||!c||!s){$('umsg').innerHTML='<div class="alert alert-error"><i class="ti ti-alert-circle"></i>Preencha todos os campos.</div>';return;}
  const ok=await postData({tipo:'usuario',nome:n,cpf:c,setor:s},'umsg');
  if(ok){['u-n','u-c','u-s'].forEach(i=>{const e=$(i);if(e)e.value='';});}
}

async function cadPerg(){
  const s=gv('p-s'),d=gv('p-d'),t=gv('p-t'),a=gv('p-a'),b=gv('p-b'),c=gv('p-c'),dv=gv('p-d2'),r=gv('p-r');
  if(!t||!a||!b){$('pmsg').innerHTML='<div class="alert alert-error"><i class="ti ti-alert-circle"></i>Preencha a pergunta e ao menos A e B.</div>';return;}
  const ok=await postData({tipo:'pergunta',setor:s,dds:d,pergunta:t,a,b,c,d:dv,correta:r},'pmsg');
  if(ok){['p-s','p-d','p-t','p-a','p-b','p-c','p-d2'].forEach(i=>{const e=$(i);if(e)e.value='';});}
}

/* ---- QUIZ ---- */
async function showQuiz(){
  main().innerHTML=`<div class="wrap screen"><div class="card"><div class="card-body"><div class="alert alert-info"><i class="ti ti-loader"></i>Carregando perguntas...</div></div></div></div>`;
  try{
    const r=await fetch(SURL);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    let pool=data;
    if(user&&user.setor){
      const f=data.filter(q=>!q.setor||q.setor.trim().toLowerCase()===user.setor.trim().toLowerCase());
      if(f.length>=3)pool=f;
    }
    perguntas=pool.sort(()=>0.5-Math.random()).slice(0,10);
    respostas={};qIdx=0;ended=false;
    renderQ();
  }catch(e){
    main().innerHTML=`<div class="wrap screen"><div class="card"><div class="card-body">
      <div class="alert alert-error"><i class="ti ti-alert-circle"></i>${e.message}</div>
      <button class="btn btn-ghost" onclick="showQuiz()" style="margin-top:12px"><i class="ti ti-refresh"></i> Tentar novamente</button>
    </div></div></div>`;
  }
}

function renderQ(){
  if(ended){renderResult();return;}
  const total=perguntas.length;
  const resp=Object.keys(respostas).length;
  const pct=total?Math.round(resp/total*100):0;
  const q=perguntas[qIdx];
  if(!q)return;
  const opts=[['a','A'],['b','B'],['c','C'],['d','D']];
  let optsH='';
  opts.forEach(([k,L])=>{
    if(!q[k])return;
    const sel=respostas[qIdx]===L;
    optsH+=`<div class="opt${sel?' selected':''}" onclick="pick(${qIdx},'${L}')">
      <div class="opt-key">${L}</div>
      <div class="opt-text">${q[k]}</div>
    </div>`;
  });
  const isLast=qIdx===total-1;
  main().innerHTML=`
  <div class="wrap screen">
    <div class="card">
      <div class="card-body">
        <div class="prog-wrap">
          <div class="prog-info"><span>${resp} de ${total} respondidas</span><span>${pct}%</span></div>
          <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="q-num">Questão ${qIdx+1} de ${total}</div>
        <div class="q-text">${q.pergunta||q.dds||'—'}</div>
        ${optsH}
        <div class="q-nav">
          <button class="btn btn-ghost" onclick="qIdx=Math.max(0,qIdx-1);renderQ()" ${qIdx===0?'disabled':''}>
            <i class="ti ti-arrow-left" aria-hidden="true"></i> Anterior
          </button>
          ${isLast
            ?`<button class="btn btn-green" onclick="confirmEnd()">Finalizar <i class="ti ti-send" aria-hidden="true"></i></button>`
            :`<button class="btn btn-primary" onclick="qIdx++;renderQ()">Próxima <i class="ti ti-arrow-right" aria-hidden="true"></i></button>`}
        </div>
      </div>
    </div>
    <div class="qmap">${perguntas.map((_,i)=>{
      const cur=i===qIdx;
      const ans=respostas[i];
      const bg=cur?'var(--blue-light)':ans?'var(--green-light)':'var(--gray7)';
      const bd=cur?'var(--blue)':ans?'var(--green)':'var(--gray5)';
      const cl=cur?'var(--blue-dark)':ans?'var(--green)':'var(--gray4)';
      return `<div class="qmap-dot" onclick="qIdx=${i};renderQ()" style="background:${bg};border:1.5px solid ${bd};color:${cl}">${i+1}</div>`;
    }).join('')}</div>
  </div>`;
}

function pick(qi,val){respostas[qi]=val;renderQ();}

function confirmEnd(){
  const miss=perguntas.length-Object.keys(respostas).length;
  if(miss>0&&!confirm(`${miss} pergunta(s) sem resposta. Finalizar mesmo assim?`))return;
  finalize();
}

async function finalize(){
  let ac=0;
  perguntas.forEach((q,i)=>{if(respostas[i]===(q.correta||'').toUpperCase())ac++;});
  ended=true;
  const res=ac>=7?'APROVADO':'REPROVADO';
  if(user&&user.cpf){
    try{
      await fetch(SURL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({tipo:'resultado',cpf:user.cpf,nome:user.nome,setor:user.setor,acertos:ac,resultado:res})});
    }catch(e){}
  }
  renderResult(ac,res);
}

function renderResult(ac,res){
  const total=perguntas.length;
  if(ac===undefined){
    ac=0;
    perguntas.forEach((q,i)=>{if(respostas[i]===(q.correta||'').toUpperCase())ac++;});
    res=ac>=7?'APROVADO':'REPROVADO';
  }
  const pct=Math.round(ac/total*100);
  const ok=res==='APROVADO';
  main().innerHTML=`
  <div class="wrap screen">
    <div class="card">
      <div class="result-hero">
        <div class="result-ring ${ok?'ok':'fail'}">${pct}%</div>
        <div class="result-label ${ok?'ok':'fail'}">${res}</div>
        <div class="result-sub">${ac} acertos em ${total} questões</div>
        <div class="stats">
          <div class="stat"><div class="stat-num" style="color:var(--green)">${ac}</div><div class="stat-lbl">Acertos</div></div>
          <div class="stat"><div class="stat-num" style="color:var(--red)">${total-ac}</div><div class="stat-lbl">Erros</div></div>
          <div class="stat"><div class="stat-num">${pct}%</div><div class="stat-lbl">Aproveit.</div></div>
        </div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="renderGabarito()"><i class="ti ti-list-check" aria-hidden="true"></i> Ver gabarito</button>
          <button class="btn btn-ghost" onclick="showQuiz()"><i class="ti ti-refresh" aria-hidden="true"></i> Refazer</button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderGabarito(){
  const opts=[['a','A'],['b','B'],['c','C'],['d','D']];
  let html='';
  perguntas.forEach((q,i)=>{
    const corr=(q.correta||'').toUpperCase();
    const resp=respostas[i];
    const ok=resp===corr;
    html+=`<div class="q-block">
      <div class="q-num">Questão ${i+1} · <span style="color:${ok?'var(--green)':'var(--red)'}">${ok?'Correta ✓':'Errada ✗'}</span></div>
      <div class="q-text" style="font-size:14px">${q.pergunta||q.dds||'—'}</div>`;
    opts.forEach(([k,L])=>{
      if(!q[k])return;
      const isC=L===corr,isR=L===resp;
      html+=`<div class="opt${isC?' correct':isR?' wrong':''}" style="cursor:default">
        <div class="opt-key">${L}</div>
        <div class="opt-text">${q[k]}</div>
      </div>`;
    });
    html+='</div>';
  });
  main().innerHTML=`
  <div class="wrap screen">
    <div class="card">
      <div class="card-hd">
        <div class="card-title"><i class="ti ti-list-check" aria-hidden="true"></i> Gabarito completo</div>
        <button class="btn btn-ghost" onclick="renderResult()" style="padding:6px 11px;font-size:12px"><i class="ti ti-arrow-left" aria-hidden="true"></i> Voltar</button>
      </div>
      <div class="card-body">${html}</div>
    </div>
  </div>`;
}

showLogin();
</script>
