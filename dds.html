<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DDS Sistema</title>

<style>
body{font-family:Arial;background:#0f172a;color:#fff;text-align:center;}
.container{max-width:500px;margin:auto;background:#1e293b;padding:20px;border-radius:12px;margin-top:40px;}
button{background:#22c55e;color:#fff;border:none;padding:10px;width:100%;margin-top:10px;border-radius:8px;}
.progresso{height:10px;background:#38bdf8;border-radius:10px;}
</style>
</head>

<body>

<div id="login" class="container">
<h2>Login</h2>
<input id="user" placeholder="CPF"><br>
<input id="pass" placeholder="Senha"><br>
<button onclick="login()">Entrar</button>
</div>

<div id="func" class="container" style="display:none;">
<div id="quiz"></div>
</div>

<div id="admin" class="container" style="display:none;">
<h2>ADMIN</h2>
<button onclick="carregarResultados()">Resultados</button>
<button onclick="verRanking()">Ranking</button>
<button onclick="verNaoFizeram()">Não fizeram</button>

<div id="painel"></div>
</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbydNjX4Vatru-SXzRuEEO8ESNPguCpnswGy3VzJWbMPqGEcoFAc0ExTkn9EUQftGsqk/exec";

let perguntas=[],respostas=[],i=0,usuario={};

function login(){
let u=user.value,p=pass.value;

if(u==='admin' && p==='admin123'){
loginDiv.style.display='none';
admin.style.display='block';
return;
}

fetch(URL+"?usuarios=1")
.then(r=>r.json())
.then(data=>{
let user=data.find(x=>x.cpf==u && x.senha==p);
if(user){
usuario=user;
loginDiv.style.display='none';
func.style.display='block';
carregarQuiz();
}else alert('erro');
});
}

function carregarQuiz(){
fetch(URL)
.then(r=>r.json())
.then(data=>{
perguntas=data.filter(q=>q.setor==usuario.setor);
i=0;respostas=[];
mostrar();
});
}

function mostrar(){
let q=perguntas[i];
let prog=((i+1)/perguntas.length)*100;

quiz.innerHTML=`
<div class="progresso" style="width:${prog}%"></div>
<h3>${q.dds}</h3>
<p>${q.pergunta}</p>

<label><input type=radio name=r value=A>${q.a}</label><br>
<label><input type=radio name=r value=B>${q.b}</label><br>
<label><input type=radio name=r value=C>${q.c}</label><br>
<label><input type=radio name=r value=D>${q.d}</label><br>

<button onclick="prox()">Próxima</button>
`;
}

function prox(){
let r=document.querySelector("input[name=r]:checked");
respostas.push(r?r.value:null);
i++;

if(i<perguntas.length) mostrar();
else finalizar();
}

function finalizar(){
let acertos=0;

perguntas.forEach((q,x)=>{
if(respostas[x]==q.correta) acertos++;
});

quiz.innerHTML=`<h2>${acertos} acertos</h2>`;

fetch(URL,{
method:'POST',
mode:'no-cors',
body:JSON.stringify({
tipo:'resultado',
cpf:usuario.cpf,
nome:usuario.nome,
setor:usuario.setor,
dds:perguntas[0].dds,
acertos,
resultado:acertos>=7?'APROVADO':'REPROVADO'
})
});
}

function carregarResultados(){
fetch(URL+"?ranking=1")
.then(r=>r.json())
.then(d=>{
painel.innerHTML=JSON.stringify(d);
});
}

function verRanking(){
fetch(URL+"?ranking=1")
.then(r=>r.json())
.then(d=>{
d.sort((a,b)=>b.acertos-a.acertos);
painel.innerHTML=d.map(x=>x.nome+" - "+x.acertos).join("<br>");
});
}

function verNaoFizeram(){
fetch(URL+"?naofez=1")
.then(r=>r.json())
.then(d=>{
painel.innerHTML=d.map(x=>x.nome+" - "+x.setor).join("<br>");
});
}
</script>

</body>
</html>
