
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--color-background-tertiary,#f3f4f6);color:var(--color-text-primary,#111);min-height:600px;display:flex;flex-direction:column}
.topbar{background:#111928;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:50px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:8px}
.brand-dot{width:24px;height:24px;background:#1a56db;border-radius:5px;display:flex;align-items:center;justify-content:center}
.brand-dot i{font-size:13px;color:#fff}
.brand-name{font-size:13px;font-weight:600;color:#fff}
.top-right{display:flex;align-items:center;gap:10px}
.top-user{font-size:12px;color:#9ca3af;display:flex;align-items:center;gap:6px}
.top-user strong{color:#e5e7eb}
.btn-top{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:5px;padding:5px 10px;font-family:'IBM Plex Sans',sans-serif;font-size:11px;font-weight:500;color:#e5e7eb;cursor:pointer;display:flex;align-items:center;gap:5px}
.btn-top:hover{background:rgba(255,255,255,.18)}
.main{flex:1;padding:24px 16px 40px;display:flex;align-items:flex-start;justify-content:center}
.wrap{width:100%;max-width:520px}
.wrap-wide{width:100%;max-width:860px}

.card{background:var(--color-background-primary,#fff);border:0.5px solid var(--color-border-tertiary,rgba(0,0,0,.12));border-radius:var(--border-radius-lg,12px)}
.card-hd{padding:14px 18px;border-bottom:0.5px solid var(--color-border-tertiary,rgba(0,0,0,.1));display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:500;color:var(--color-text-primary);display:flex;align-items:center;gap:6px}
.card-title i{font-size:15px;color:#1a56db}
.card-body{padding:18px}

.field{margin-bottom:13px}
.field label{display:block;font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field select{width:100%;background:var(--color-background-secondary,#f9fafb);border:0.5px solid var(--color-border-secondary,rgba(0,0,0,.2));border-radius:var(--border-radius-md,8px);padding:9px 12px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:var(--color-text-primary);outline:none;transition:border .15s,box-shadow .15s}
.field input:focus,.field select:focus{border-color:#1a56db;box-shadow:0 0 0 3px rgba(26,86,219,.1);background:var(--color-background-primary)}
.field select option{background:var(--color-background-primary)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border:none;border-radius:var(--border-radius-md,8px);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-primary{background:#1a56db;color:#fff}
.btn-primary:hover{background:#1241a8}
.btn-ghost{background:transparent;border:0.5px solid var(--color-border-secondary,rgba(0,0,0,.2));color:var(--color-text-secondary)}
.btn-ghost:hover{background:var(--color-background-secondary)}
.btn-green{background:#057a55;color:#fff}
.btn-green:hover{background:#046c4e}
.btn-block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}

.hidden{display:none!important}
.screen{animation:up .2s ease}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;gap:4px}
.badge-blue{background:#e8f0fe;color:#1241a8}
.badge-green{background:#def7ec;color:#057a55}
.badge-red{background:#fde8e8;color:#c81e1e}
.badge-gray{background:var(--color-background-secondary);color:var(--color-text-secondary)}
.badge-yellow{background:#feecdc;color:#723b13}

.alert{padding:10px 12px;border-radius:var(--border-radius-md);font-size:13px;display:flex;align-items:flex-start;gap:7px;line-height:1.5;margin-bottom:10px}
.alert i{font-size:14px;flex-shrink:0;margin-top:1px}
.alert-success{background:#def7ec;color:#057a55;border:0.5px solid #a7f3d0}
.alert-error{background:#fde8e8;color:#c81e1e;border:0.5px solid #fca5a5}
.alert-info{background:#e8f0fe;color:#1241a8;border:0.5px solid #bfdbfe}
.alert-warn{background:#feecdc;color:#723b13;border:0.5px solid #fcd34d}

.tabs{display:flex;border-bottom:0.5px solid var(--color-border-tertiary);padding:0 18px}
.tab{padding:10px 12px;font-size:13px;font-weight:500;color:var(--color-text-secondary);border-bottom:2px solid transparent;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;font-family:'IBM Plex Sans',sans-serif;transition:all .15s}
.tab:hover{color:var(--color-text-primary)}
.tab.active{color:#1a56db;border-bottom-color:#1a56db}

/* Login tela colaborador */
.login-hero{text-align:center;padding:24px 18px 8px}
.login-icon{width:48px;height:48px;background:#1a56db;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 11px}
.login-icon i{font-size:24px;color:#fff}

/* DDS cards grid */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px;text-align:center}
.stat-num{font-size:22px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.stat-lbl{font-size:10px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}

.section-title{font-size:12px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:6px}

.dds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:20px}
.dds-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px;cursor:pointer;transition:border .15s,box-shadow .15s;display:flex;flex-direction:column;gap:10px}
.dds-card:hover{border-color:rgba(26,86,219,.4);box-shadow:0 2px 8px rgba(26,86,219,.08)}
.dds-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.dds-card-icon{width:36px;height:36px;border-radius:8px;background:#e8f0fe;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dds-card-icon i{font-size:18px;color:#1a56db}
.dds-card-name{font-size:14px;font-weight:500;color:var(--color-text-primary);line-height:1.35;flex:1}
.dds-card-setor{font-size:11px;color:var(--color-text-secondary);margin-top:2px}
.dds-card-footer{display:flex;align-items:center;justify-content:space-between}
.dds-card-footer .btn{padding:6px 12px;font-size:12px}

/* Quiz */
.prog-wrap{margin-bottom:16px}
.prog-info{display:flex;justify-content:space-between;font-size:12px;color:var(--color-text-secondary);margin-bottom:5px}
.prog-track{height:5px;background:var(--color-background-secondary);border-radius:3px}
.prog-fill{height:100%;background:#1a56db;border-radius:3px;transition:width .3s}

.q-label{font-size:10px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.5px;font-family:'IBM Plex Mono',monospace;margin-bottom:5px}
.q-text{font-size:15px;font-weight:500;color:var(--color-text-primary);line-height:1.5;margin-bottom:14px}

.opt{display:flex;align-items:center;gap:10px;padding:10px 13px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);margin-bottom:7px;cursor:pointer;transition:all .15s;background:var(--color-background-primary)}
.opt:hover{border-color:#1a56db;background:#e8f0fe}
.opt.sel{border-color:#1a56db;background:#e8f0fe}
.opt.correct{border-color:#057a55!important;background:#def7ec!important}
.opt.wrong{border-color:#c81e1e!important;background:#fde8e8!important}
.opt-key{width:24px;height:24px;border-radius:5px;background:var(--color-background-secondary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--color-text-secondary);flex-shrink:0;font-family:'IBM Plex Mono',monospace;transition:all .15s}
.opt.sel .opt-key{background:#1a56db;color:#fff}
.opt.correct .opt-key{background:#057a55;color:#fff}
.opt.wrong .opt-key{background:#c81e1e;color:#fff}
.opt-text{font-size:13px;color:var(--color-text-secondary);line-height:1.35}

.q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:0.5px solid var(--color-border-tertiary)}

.qmap{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.qm{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;cursor:pointer;font-family:'IBM Plex Mono',monospace;border:0.5px solid;transition:all .15s}

/* Resultado */
.result-ring{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:22px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.r-ok{background:#def7ec;color:#057a55;border:2px solid #6ee7b7}
.r-fail{background:#fde8e8;color:#c81e1e;border:2px solid #fca5a5}

/* Admin - wizard perguntas */
.wiz-step{display:flex;align-items:center;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.wiz-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-family:'IBM Plex Mono',monospace;border:1.5px solid;transition:all .15s;flex-shrink:0}
.wiz-dot.done{background:#057a55;border-color:#057a55;color:#fff}
.wiz-dot.active{background:#1a56db;border-color:#1a56db;color:#fff}
.wiz-dot.todo{background:transparent;border-color:var(--color-border-secondary);color:var(--color-text-secondary)}
.wiz-line{flex:1;height:1px;background:var(--color-border-tertiary);min-width:8px;max-width:20px}
</style>

<div id="app">
<div class="topbar">
  <div class="brand">
    <div class="brand-dot"><i class="ti ti-shield-check" aria-hidden="true"></i></div>
    <span class="brand-name">DDS Sistema</span>
  </div>
  <div class="top-right" id="top-right"></div>
</div>
<div class="main" id="main"></div>
</div>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbzUtVKwS65dSO2LyGuXUHD-qz-rZsy4tauAaoYruHOlQ-DSbGwQZufnjjcFjLvVwTHuAQ/exec';
let user=null;
let allPerguntas=[];
let allResultados=[];
let allSetores=[];
let wizPerguntas=[];
let wizStep=0;
let quizPerguntas=[];
let quizRespostas={};
let quizIdx=0;
let quizDDS='';
let quizEnded=false;

const $=id=>document.getElementById(id);
const main=()=>$('main');
const gv=id=>{const e=$(id);return e?e.value.trim():'';}

function setTop(u){
  const t=$('top-right');
  if(!u){t.innerHTML='';return;}
  const isA=u==='admin';
  t.innerHTML=`<div class="top-user"><i class="ti ti-user-circle" style="font-size:16px" aria-hidden="true"></i>
    <strong>${isA?'Admin':u.nome}</strong>
    ${!isA&&u.setor?`<span class="badge badge-blue" style="font-size:10px">${u.setor}</span>`:''}
  </div>
  <button class="btn-top" onclick="logout()"><i class="ti ti-logout" aria-hidden="true"></i> Sair</button>`;
}

/* ===== LOGIN ===== */
function showLogin(){
  setTop(null);user=null;
  main().innerHTML=`
  <div class="wrap screen">
    <div class="card">
      <div class="login-hero">
        <div class="login-icon"><i class="ti ti-shield-check" aria-hidden="true"></i></div>
        <div style="font-size:18px;font-weight:600;margin-bottom:4px">Diálogo Diário de Segurança</div>
        <div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:4px">Identifique-se com CPF e Setor para iniciar</div>
      </div>
      <div class="card-body">
        <div class="field"><label>CPF</label><input id="inp-u" placeholder="Digite seu CPF"/></div>
        <div class="field"><label>Senha</label><input id="inp-p" type="password" placeholder="Digite sua senha" onkeydown="if(event.key==='Enter')doLogin()"/></div>
        <div id="lmsg"></div>
        <button class="btn btn-primary btn-block" onclick="doLogin()"><i class="ti ti-login" aria-hidden="true"></i> Entrar</button>
        <div style="text-align:center;margin-top:14px">
          <button class="btn btn-ghost" onclick="showAdminLogin()" style="font-size:12px;padding:6px 12px">
            <i class="ti ti-settings" aria-hidden="true"></i> Acesso administrativo
          </button>
        </div>
      </div>
    </div>
  </div>`;
}

function showAdminLogin(){
  main().innerHTML=`
  <div class="wrap screen">
    <div class="card">
      <div class="card-hd">
        <div class="card-title"><i class="ti ti-settings" aria-hidden="true"></i> Acesso Admin</div>
        <button class="btn btn-ghost" onclick="showLogin()" style="padding:5px 10px;font-size:12px"><i class="ti ti-arrow-left" aria-hidden="true"></i></button>
      </div>
      <div class="card-body">
        <div class="field"><label>Usuário</label><input id="au" placeholder="admin" value="admin"/></div>
        <div class="field"><label>Senha</label><input id="ap" type="password" placeholder="admin123" onkeydown="if(event.key==='Enter')adminLogin()"/></div>
        <div id="amsg"></div>
        <button class="btn btn-primary btn-block" onclick="adminLogin()"><i class="ti ti-login" aria-hidden="true"></i> Entrar</button>
      </div>
    </div>
  </div>`;
}

function adminLogin(){
  if(gv('au')==='admin'&&gv('ap')==='admin123'){user='admin';setTop('admin');showAdmin();}
  else $('amsg').innerHTML='<div class="alert alert-error"><i class="ti ti-alert-circle"></i>Credenciais inválidas.</div>';
}

async function doLogin(){
  const u=gv('inp-u'),p=gv('inp-p');
  const m=$('lmsg');
  if(!u||!p){m.innerHTML='<div class="alert alert-warn"><i class="ti ti-alert-triangle"></i>Preencha CPF e senha.</div>';return;}
  m.innerHTML='<div class="alert alert-info"><i class="ti ti-loader"></i>Verificando...</div>';
  try{
    const r=await fetch(SCRIPT_URL+'?usuarios=1');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    const clean=s=>String(s||'').replace(/\D/g,'');
    const found=data.find(x=>clean(x.cpf)===clean(u)&&clean(x.senha)===clean(p));
    if(found){
      user=found;setTop(found);
      await loadAllData();
      showDashboard();
    }else{
      m.innerHTML='<div class="alert alert-error"><i class="ti ti-alert-circle"></i>CPF ou senha inválidos.</div>';
    }
  }catch(e){
    m.innerHTML=`<div class="alert alert-error"><i class="ti ti-alert-circle"></i>${e.message}</div>`;
  }
}

async function loadAllData(){
  try{
    const [rp,rr]=await Promise.all([fetch(SCRIPT_URL),fetch(SCRIPT_URL+'?resultados=1')]);
    const pgs=await rp.json();
    allPerguntas=pgs;
    try{const rs=await rr.json();allResultados=Array.isArray(rs)?rs:[];}catch(e){allResultados=[];}
  }catch(e){allPerguntas=[];allResultados=[];}
}

function logout(){user=null;allPerguntas=[];allResultados=[];showLogin();}

/* ===== DASHBOARD COLABORADOR ===== */
function showDashboard(){
  const setor=(user.setor||'').trim().toLowerCase();
  const pool=allPerguntas.filter(q=>!q.setor||q.setor.trim().toLowerCase()===setor||setor==='');
  const ddsMap={};
  pool.forEach(q=>{
    const nome=(q.dds||q.setor||'Geral').trim();
    if(!ddsMap[nome])ddsMap[nome]={nome,setor:q.setor||'',perguntas:[]};
    ddsMap[nome].perguntas.push(q);
  });
  const ddsList=Object.values(ddsMap);

  const userRes=allResultados.filter(r=>String(r.cpf||'').replace(/\D/g,'')===String(user.cpf||'').replace(/\D/g,''));
  const resMap={};
  userRes.forEach(r=>{const k=(r.dds||r.resultado||'');if(r.dds)resMap[r.dds]=r.resultado;});
  userRes.forEach(r=>{if(r.dds)resMap[r.dds]=r.resultado;});

  let pendentes=0,concluidos=0,reprovados=0;
  ddsList.forEach(d=>{
    const res=resMap[d.nome];
    if(res==='APROVADO')concluidos++;
    else if(res==='REPROVADO')reprovados++;
    else pendentes++;
  });

  let cardsHtml='';
  ddsList.forEach(d=>{
    const res=resMap[d.nome];
    let statusBadge,btnLabel,btnClass;
    if(res==='APROVADO'){
      statusBadge='<span class="badge badge-green"><i class="ti ti-check"></i> Aprovado</span>';
      btnLabel='Refazer';btnClass='btn-ghost';
    }else if(res==='REPROVADO'){
      statusBadge='<span class="badge badge-red"><i class="ti ti-x"></i> Reprovado</span>';
      btnLabel='Tentar novamente';btnClass='btn-primary';
    }else{
      statusBadge='<span class="badge badge-gray"><i class="ti ti-clock"></i> A fazer</span>';
      btnLabel='Iniciar';btnClass='btn-primary';
    }
    cardsHtml+=`<div class="dds-card">
      <div class="dds-card-top">
        <div class="dds-card-icon"><i class="ti ti-clipboard-list" aria-hidden="true"></i></div>
        <div style="flex:1">
          <div class="dds-card-name">${d.nome}</div>
          ${d.setor?`<div class="dds-card-setor"><i class="ti ti-building" style="font-size:10px;vertical-align:-1px" aria-hidden="true"></i> ${d.setor}</div>`:''}
        </div>
      </div>
      <div class="dds-card-footer">
        ${statusBadge}
        <button class="btn ${btnClass}" onclick="startQuiz('${encodeURIComponent(d.nome)}')" style="padding:6px 12px;font-size:12px">
          <i class="ti ti-arrow-right" aria-hidden="true"></i> ${btnLabel}
        </button>
      </div>
    </div>`;
  });

  if(!cardsHtml)cardsHtml=`<div style="grid-column:1/-1;text-align:center;padding:32px;color:var(--color-text-secondary);font-size:13px">
    <i class="ti ti-inbox" style="font-size:32px;display:block;margin-bottom:8px" aria-hidden="true"></i>
    Nenhum DDS disponível para seu setor ainda.
  </div>`;

  main().innerHTML=`
  <div class="wrap-wide screen">
    <div style="margin-bottom:20px">
      <div style="font-size:18px;font-weight:600;margin-bottom:2px">Olá, ${user.nome.split(' ')[0]} 👋</div>
      <div style="font-size:13px;color:var(--color-text-secondary)">Setor: <strong>${user.setor}</strong></div>
    </div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" style="color:#723b13">${pendentes}</div>
        <div class="stat-lbl">Pendentes</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" style="color:#057a55">${concluidos}</div>
        <div class="stat-lbl">Concluídos</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" style="color:#c81e1e">${reprovados}</div>
        <div class="stat-lbl">Reprovados</div>
      </div>
    </div>
    <div class="section-title"><i class="ti ti-list" aria-hidden="true"></i> Meus DDS</div>
    <div class="dds-grid">${cardsHtml}</div>
  </div>`;
}

function startQuiz(ddsEncoded){
  const ddsNome=decodeURIComponent(ddsEncoded);
  const setor=(user.setor||'').trim().toLowerCase();
  const pool=allPerguntas.filter(q=>{
    const qDDS=(q.dds||q.setor||'Geral').trim();
    return qDDS===ddsNome;
  });
  if(pool.length===0){
    alert('Nenhuma pergunta cadastrada para este DDS.');return;
  }
  quizPerguntas=pool.sort(()=>0.5-Math.random()).slice(0,10);
  quizRespostas={};quizIdx=0;quizEnded=false;quizDDS=ddsNome;
  renderQuiz();
}

/* ===== QUIZ ===== */
function renderQuiz(){
  if(quizEnded){renderResult();return;}
  const total=quizPerguntas.length;
  const resp=Object.keys(quizRespostas).length;
  const pct=total?Math.round(resp/total*100):0;
  const q=quizPerguntas[quizIdx];
  if(!q)return;
  const opts=[['a','A'],['b','B'],['c','C'],['d','D']];
  let optsH='';
  opts.forEach(([k,L])=>{
    if(!q[k])return;
    const sel=quizRespostas[quizIdx]===L;
    optsH+=`<div class="opt${sel?' sel':''}" onclick="pickOpt(${quizIdx},'${L}')">
      <div class="opt-key">${L}</div>
      <div class="opt-text">${q[k]}</div>
    </div>`;
  });
  const isLast=quizIdx===total-1;
  const qmapH=quizPerguntas.map((_,i)=>{
    const cur=i===quizIdx;
    const ans=quizRespostas[i];
    const bg=cur?'#1a56db':ans?'#057a55':'var(--color-background-secondary)';
    const bd=cur?'#1a56db':ans?'#057a55':'var(--color-border-secondary)';
    const cl=cur?'#fff':ans?'#fff':'var(--color-text-secondary)';
    return `<div class="qm" onclick="quizIdx=${i};renderQuiz()" style="background:${bg};border-color:${bd};color:${cl}">${i+1}</div>`;
  }).join('');

  main().innerHTML=`
  <div class="wrap screen">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <button class="btn btn-ghost" onclick="showDashboard()" style="padding:6px 10px;font-size:12px">
        <i class="ti ti-arrow-left" aria-hidden="true"></i> Voltar
      </button>
      <div style="font-size:13px;font-weight:500;flex:1">${quizDDS}</div>
      <span class="badge badge-blue">${total} questões</span>
    </div>
    <div class="card">
      <div class="card-body">
        <div class="prog-wrap">
          <div class="prog-info"><span>${resp} de ${total} respondidas</span><span>${pct}%</span></div>
          <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="q-label">Questão ${quizIdx+1} de ${total}</div>
        <div class="q-text">${q.pergunta||'—'}</div>
        ${optsH}
        <div class="q-nav">
          <button class="btn btn-ghost" onclick="quizIdx=Math.max(0,quizIdx-1);renderQuiz()" ${quizIdx===0?'disabled':''}>
            <i class="ti ti-arrow-left" aria-hidden="true"></i> Anterior
          </button>
          ${isLast
            ?`<button class="btn btn-green" onclick="confirmFinalizar()">Finalizar <i class="ti ti-send" aria-hidden="true"></i></button>`
            :`<button class="btn btn-primary" onclick="quizIdx++;renderQuiz()">Próxima <i class="ti ti-arrow-right" aria-hidden="true"></i></button>`
          }
        </div>
      </div>
    </div>
    <div class="qmap" style="margin-top:12px">${qmapH}</div>
  </div>`;
}

function pickOpt(qi,val){quizRespostas[qi]=val;renderQuiz();}

function confirmFinalizar(){
  const miss=quizPerguntas.length-Object.keys(quizRespostas).length;
  if(miss>0&&!confirm(`${miss} pergunta(s) sem resposta. Finalizar mesmo assim?`))return;
  finalizarQuiz();
}

async function finalizarQuiz(){
  let ac=0;
  quizPerguntas.forEach((q,i)=>{if(quizRespostas[i]===(q.correta||'').toUpperCase())ac++;});
  quizEnded=true;
  const res=ac>=7?'APROVADO':'REPROVADO';
  try{
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({tipo:'resultado',cpf:user.cpf,nome:user.nome,setor:user.setor,dds:quizDDS,acertos:ac,resultado:res})});
  }catch(e){}
  renderResult(ac,res);
}

function renderResult(ac,res){
  const total=quizPerguntas.length;
  if(ac===undefined){
    ac=0;quizPerguntas.forEach((q,i)=>{if(quizRespostas[i]===(q.correta||'').toUpperCase())ac++;});
    res=ac>=7?'APROVADO':'REPROVADO';
  }
  const pct=Math.round(ac/total*100);
  const ok=res==='APROVADO';
  main().innerHTML=`
  <div class="wrap screen">
    <div class="card">
      <div style="text-align:center;padding:28px 18px">
        <div class="result-ring ${ok?'r-ok':'r-fail'}">${pct}%</div>
        <div style="font-size:20px;font-weight:600;color:${ok?'#057a55':'#c81e1e'};margin-bottom:4px">${res}</div>
        <div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:20px">${ac} acertos em ${total} questões — ${quizDDS}</div>
        <div class="stats-row" style="max-width:280px;margin:0 auto 20px">
          <div class="stat-card"><div class="stat-num" style="color:#057a55">${ac}</div><div class="stat-lbl">Acertos</div></div>
          <div class="stat-card"><div class="stat-num" style="color:#c81e1e">${total-ac}</div><div class="stat-lbl">Erros</div></div>
          <div class="stat-card"><div class="stat-num">${pct}%</div><div class="stat-lbl">Aproveit.</div></div>
        </div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="renderGabarito()"><i class="ti ti-list-check" aria-hidden="true"></i> Ver gabarito</button>
          <button class="btn btn-ghost" onclick="showDashboard()"><i class="ti ti-home" aria-hidden="true"></i> Meus DDS</button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderGabarito(){
  const opts=[['a','A'],['b','B'],['c','C'],['d','D']];
  let html='';
  quizPerguntas.forEach((q,i)=>{
    const corr=(q.correta||'').toUpperCase();
    const resp=quizRespostas[i];
    const ok=resp===corr;
    html+=`<div style="margin-bottom:18px;padding-bottom:18px;border-bottom:0.5px solid var(--color-border-tertiary)">
      <div style="font-size:10px;font-weight:500;color:${ok?'#057a55':'#c81e1e'};text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;font-family:'IBM Plex Mono',monospace">
        Q${i+1} · ${ok?'Correta ✓':'Errada ✗'}</div>
      <div style="font-size:14px;font-weight:500;margin-bottom:10px;line-height:1.45">${q.pergunta||'—'}</div>`;
    opts.forEach(([k,L])=>{
      if(!q[k])return;
      const isC=L===corr,isR=L===resp;
      html+=`<div class="opt${isC?' correct':isR?' wrong':''}" style="cursor:default;margin-bottom:5px">
        <div class="opt-key">${L}</div>
        <div class="opt-text">${q[k]}</div>
      </div>`;
    });
    html+='</div>';
  });
  main().innerHTML=`
  <div class="wrap screen">
    <div class="card">
      <div class="card-hd">
        <div class="card-title"><i class="ti ti-list-check" aria-hidden="true"></i> Gabarito — ${quizDDS}</div>
        <button class="btn btn-ghost" onclick="renderResult()" style="padding:5px 10px;font-size:12px">
          <i class="ti ti-arrow-left" aria-hidden="true"></i> Voltar
        </button>
      </div>
      <div class="card-body">${html}</div>
    </div>
  </div>`;
}

/* ===== ADMIN ===== */
function showAdmin(){
  main().innerHTML=`
  <div class="wrap-wide screen">
    <div class="card">
      <div class="tabs">
        <button class="tab active" id="tab-u" onclick="atab('u')"><i class="ti ti-users" aria-hidden="true"></i> Usuários</button>
        <button class="tab" id="tab-p" onclick="atab('p')"><i class="ti ti-clipboard-list" aria-hidden="true"></i> Perguntas (10)</button>
      </div>
      <div id="abody" class="card-body"></div>
    </div>
  </div>`;
  atab('u');
}

function atab(t){
  ['u','p'].forEach(x=>$('tab-'+x).classList.toggle('active',x===t));
  const b=$('abody');
  if(t==='u'){
    b.innerHTML=`
      <div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:14px">A senha do funcionário será o CPF (somente números).</div>
      <div class="field"><label>Nome completo</label><input id="u-n" placeholder="Ex: João da Silva"/></div>
      <div class="row2">
        <div class="field"><label>CPF <span style="font-size:10px;color:var(--color-text-secondary)">(será a senha)</span></label><input id="u-c" placeholder="000.000.000-00"/></div>
        <div class="field"><label>Setor</label><input id="u-s" placeholder="Ex: Produção"/></div>
      </div>
      <div id="umsg"></div>
      <button class="btn btn-primary" onclick="cadUser()"><i class="ti ti-user-plus" aria-hidden="true"></i> Salvar Usuário</button>`;
  }else{
    wizPerguntas=[];wizStep=0;
    renderWiz();
  }
}

function renderWiz(){
  const b=$('abody');
  const total=10;
  const steps=Array.from({length:total},(_,i)=>{
    const s=i<wizStep?'done':i===wizStep?'active':'todo';
    return `<div class="wiz-dot ${s}">${i<wizStep?'<i class="ti ti-check" style="font-size:10px"></i>':(i+1)}</div>${i<total-1?'<div class="wiz-line"></div>':''}`;
  }).join('');

  if(wizStep===total){
    b.innerHTML=`
      <div style="text-align:center;padding:20px 0 10px">
        <i class="ti ti-check-circle" style="font-size:40px;color:#057a55;display:block;margin-bottom:10px" aria-hidden="true"></i>
        <div style="font-size:16px;font-weight:500;margin-bottom:4px">10 perguntas prontas!</div>
        <div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:20px">Revise abaixo e envie tudo de uma vez.</div>
      </div>
      <div id="wiz-preview" style="margin-bottom:16px"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-green" onclick="enviarPerguntas()"><i class="ti ti-send" aria-hidden="true"></i> Enviar todas (10) para o Sheets</button>
        <button class="btn btn-ghost" onclick="wizStep=0;wizPerguntas=[];renderWiz()"><i class="ti ti-refresh" aria-hidden="true"></i> Recomeçar</button>
      </div>
      <div id="wiz-msg" style="margin-top:10px"></div>`;
    let prev='';
    wizPerguntas.forEach((p,i)=>{
      prev+=`<div style="padding:10px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
        <div style="font-size:11px;font-weight:500;color:var(--color-text-secondary);font-family:'IBM Plex Mono',monospace;margin-bottom:3px">Q${i+1} · <span class="badge badge-green" style="font-size:10px">${p.correta}</span></div>
        <div style="font-size:13px;font-weight:500">${p.pergunta}</div>
      </div>`;
    });
    $('wiz-preview').innerHTML=prev;
    return;
  }

  const cur=wizPerguntas[wizStep]||{setor:'',dds:'',pergunta:'',a:'',b:'',c:'',d:'',correta:'A'};
  b.innerHTML=`
    <div style="margin-bottom:14px">
      <div style="font-size:13px;font-weight:500;margin-bottom:10px">Questão ${wizStep+1} de 10</div>
      <div class="wiz-step">${steps}</div>
    </div>
    ${wizStep===0?`
    <div class="row2">
      <div class="field"><label>Setor <span style="font-size:10px;color:var(--color-text-secondary)">(vazio = todos)</span></label><input id="w-setor" value="${cur.setor}" placeholder="Ex: Produção"/></div>
      <div class="field"><label>Tema DDS</label><input id="w-dds" value="${cur.dds}" placeholder="Ex: Uso de EPI"/></div>
    </div>`:`
    <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;font-size:12px;color:var(--color-text-secondary);margin-bottom:12px">
      <i class="ti ti-tag" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"></i>
      <strong>Setor:</strong> ${wizPerguntas[0]&&wizPerguntas[0].setor||'Todos'} &nbsp;·&nbsp; <strong>DDS:</strong> ${wizPerguntas[0]&&wizPerguntas[0].dds||'—'}
    </div>`}
    <div class="field"><label>Pergunta ${wizStep+1}</label><input id="w-perg" value="${cur.pergunta}" placeholder="Digite a pergunta aqui"/></div>
    <div class="row2">
      <div class="field"><label>Alternativa A</label><input id="w-a" value="${cur.a}" placeholder="Opção A"/></div>
      <div class="field"><label>Alternativa B</label><input id="w-b" value="${cur.b}" placeholder="Opção B"/></div>
    </div>
    <div class="row2">
      <div class="field"><label>Alternativa C <span style="font-size:10px">(opcional)</span></label><input id="w-c" value="${cur.c}" placeholder="Opção C"/></div>
      <div class="field"><label>Alternativa D <span style="font-size:10px">(opcional)</span></label><input id="w-d" value="${cur.d}" placeholder="Opção D"/></div>
    </div>
    <div class="field" style="max-width:180px"><label>Resposta correta</label>
      <select id="w-correta">
        ${['A','B','C','D'].map(v=>`<option value="${v}" ${cur.correta===v?'selected':''}>${v}</option>`).join('')}
      </select>
    </div>
    <div id="wmsg"></div>
    <div style="display:flex;gap:10px;margin-top:4px;flex-wrap:wrap">
      ${wizStep>0?`<button class="btn btn-ghost" onclick="wizStep--;renderWiz()"><i class="ti ti-arrow-left" aria-hidden="true"></i> Anterior</button>`:''}
      <button class="btn btn-primary" onclick="wizProx()">
        ${wizStep<9?'Próxima <i class="ti ti-arrow-right" aria-hidden="true"></i>':'Revisar e enviar <i class="ti ti-check" aria-hidden="true"></i>'}
      </button>
    </div>`;
}

function wizProx(){
  const setor=wizStep===0?gv('w-setor'):(wizPerguntas[0]&&wizPerguntas[0].setor||'');
  const dds=wizStep===0?gv('w-dds'):(wizPerguntas[0]&&wizPerguntas[0].dds||'');
  const perg=gv('w-perg'),a=gv('w-a'),b=gv('w-b'),c=gv('w-c'),d=gv('w-d');
  const correta=gv('w-correta');
  if(!perg||!a||!b){
    $('wmsg').innerHTML='<div class="alert alert-error"><i class="ti ti-alert-circle"></i>Preencha a pergunta e as alternativas A e B.</div>';
    return;
  }
  wizPerguntas[wizStep]={setor,dds,pergunta:perg,a,b,c,d,correta};
  wizStep++;
  renderWiz();
}

async function enviarPerguntas(){
  const m=$('wiz-msg');
  m.innerHTML='<div class="alert alert-info"><i class="ti ti-loader"></i>Enviando 10 perguntas...</div>';
  let ok=0;
  for(const p of wizPerguntas){
    try{
      await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({tipo:'pergunta',...p})});
      ok++;
    }catch(e){}
  }
  m.innerHTML=`<div class="alert alert-success"><i class="ti ti-check"></i>${ok} de ${wizPerguntas.length} perguntas enviadas com sucesso!</div>`;
  setTimeout(()=>{wizPerguntas=[];wizStep=0;renderWiz();},2500);
}

async function cadUser(){
  const n=gv('u-n'),c=gv('u-c'),s=gv('u-s');
  if(!n||!c||!s){$('umsg').innerHTML='<div class="alert alert-error"><i class="ti ti-alert-circle"></i>Preencha todos os campos.</div>';return;}
  $('umsg').innerHTML='<div class="alert alert-info"><i class="ti ti-loader"></i>Salvando...</div>';
  try{
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({tipo:'usuario',nome:n,cpf:c,setor:s})});
    $('umsg').innerHTML='<div class="alert alert-success"><i class="ti ti-check"></i>Usuário salvo!</div>';
    ['u-n','u-c','u-s'].forEach(i=>{const e=$(i);if(e)e.value='';});
  }catch(e){$('umsg').innerHTML=`<div class="alert alert-error"><i class="ti ti-alert-circle"></i>${e.message}</div>`;}
}

showLogin();
</script>
