            padding: 0;

        }

            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .section-title {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-color: #667eea;
        }

        .card.selected {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: #667eea;
        }

        .card h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 13px;
            opacity: 0.8;
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e9ecef;
        }

        /* Ordem de Serviço Styles */
        .ordem-servico {
            background: white;
            padding: 40px;
            max-width: 210mm;
            margin: 0 auto;
        }

        .os-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #2c3e50;
        }

        .os-title {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .os-subtitle {
            font-size: 14px;
            color: #6c757d;
        }

        .os-section {
            margin-bottom: 25px;
            border: 2px solid #e9ecef;
            padding: 20px;
            border-radius: 8px;
        }

        .os-section-title {
            background: #2c3e50;
            color: white;
            padding: 10px 15px;
            margin: -20px -20px 15px -20px;
            border-radius: 6px 6px 0 0;
            font-weight: bold;
            font-size: 14px;
        }

        .os-field {
            margin-bottom: 15px;
        }

        .os-field label {
            display: block;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .os-field input,
        .os-field textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        .os-field textarea {
            min-height: 100px;
            resize: vertical;
        }

        .os-content {
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 13px;
        }

        .os-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .signature-box {
            border-top: 2px solid #2c3e50;
            padding-top: 10px;
            margin-top: 40px;
            text-align: center;
        }

            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
            }

            .content {
                padding: 0;
            }

            .navigation,
            .btn,
            .no-print {
                display: none !important;
            }

            .ordem-servico {
                padding: 20px;
            }
        }

            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .info-box p {
            margin: 5px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Gerador de Ordem de Serviço - NR01</h1>
            <p>TRANSPORTES ARDO LTDA - Sistema de Gestão de Segurança do Trabalho</p>
        </header>

        <div class="content">
            <!-- Passo 1: Escolher Setor -->
            <div class="step active" id="step1">
                <h2 class="section-title">1️⃣ Escolha o Setor</h2>
                <div class="grid" id="setoresGrid"></div>
                <div class="navigation">
                    <div></div>
                    <button class="btn" onclick="nextStep(2)" id="btnStep1" disabled>Próximo →</button>
                </div>
            </div>

            <!-- Passo 2: Escolher Cargo -->
            <div class="step" id="step2">
                <h2 class="section-title">2️⃣ Escolha o Cargo</h2>
                <div class="info-box">
                    <p><strong>Setor Selecionado:</strong> <span id="selectedSetor"></span></p>
                </div>
                <div class="grid" id="cargosGrid"></div>
                <div class="navigation">
                    <button class="btn btn-secondary" onclick="prevStep(1)">← Voltar</button>
                    <button class="btn" onclick="nextStep(3)" id="btnStep2" disabled>Próximo →</button>
                </div>
            </div>

            <!-- Passo 3: Dados do Funcionário -->
            <div class="step" id="step3">
                <h2 class="section-title">3️⃣ Dados do Funcionário</h2>
                <div class="info-box">
                    <p><strong>Setor:</strong> <span id="selectedSetor2"></span></p>
                    <p><strong>Cargo:</strong> <span id="selectedCargo"></span></p>
                </div>

                <div class="os-section">
                    <div class="os-section-title">DADOS DO FUNCIONÁRIO</div>
                    <div class="os-grid">
                        <div class="os-field">
                            <label>Nome Completo:</label>
                            <input type="text" id="nome" required>
                        </div>
                        <div class="os-field">
                            <label>CPF:</label>
                            <input type="text" id="cpf" placeholder="000.000.000-00" required>
                        </div>
                    </div>
                    <div class="os-grid">
                        <div class="os-field">
                            <label>Data de Admissão:</label>
                            <input type="date" id="dataAdmissao" required>
                        </div>
                        <div class="os-field">
                            <label>CBO:</label>
                            <input type="text" id="cbo" value="" required>
                        </div>
                    </div>
                </div>

                <div class="navigation">
                    <button class="btn btn-secondary" onclick="prevStep(2)">← Voltar</button>
                    <button class="btn" onclick="gerarOrdem()">Gerar Ordem de Serviço →</button>
                </div>
            </div>

            <!-- Passo 4: Ordem de Serviço Gerada -->
            <div class="step" id="step4">
                <div class="no-print" style="margin-bottom: 20px;">
                    <button class="btn btn-secondary" onclick="prevStep(3)">← Voltar e Editar</button>
                    <button class="btn" onclick="window.print()">🖨️ Imprimir</button>
                    <button class="btn" onclick="resetForm()">🔄 Nova Ordem</button>
                </div>

                <div class="ordem-servico" id="ordemServico">
                    <!-- Conteúdo será gerado dinamicamente -->
                </div>
            </div>
        </div>
    </div>

            Object.keys(pgrData).forEach(gheName => {
                const ghe = pgrData[gheName];
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => selectSetor(gheName);
                
                const totalCargos = Object.keys(ghe.cargos).length;
                
                card.innerHTML = `
                    <h3>${ghe.setor}</h3>
                    <p>${totalCargos} cargo${totalCargos > 1 ? 's' : ''}</p>
                `;
                
                grid.appendChild(card);
            });
        }

        function selectSetor(gheName) {
            // Remover seleção anterior
            document.querySelectorAll('#setoresGrid .card').forEach(c => c.classList.remove('selected'));
            
            // Selecionar novo
            event.target.closest('.card').classList.add('selected');
            selectedSetor = gheName;
            
            // Habilitar botão
            document.getElementById('btnStep1').disabled = false;
        }
