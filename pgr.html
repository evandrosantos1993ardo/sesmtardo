<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PGR - Plano de Ação | Transardo</title>
<style>
:root{--p:#c0392b;--bg:#f4f6f8;--card:#fff;--bdr:#e0e0e0;--txt:#2c3e50;--mut:#7f8c8d;--grn:#27ae60;--ylw:#f39c12;--red:#e74c3c;--blu:#2980b9;--org:#e67e22;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);}
header{background:var(--p);color:#fff;padding:0 20px;display:flex;align-items:center;height:58px;gap:6px;position:sticky;top:0;z-index:99;box-shadow:0 2px 8px rgba(0,0,0,.25);}
header h1{font-size:1rem;flex:1;}
.nb{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 13px;border-radius:6px;cursor:pointer;font-size:.83rem;transition:background .2s;}
.nb:hover{background:rgba(255,255,255,.3);}
.nb.on{background:rgba(255,255,255,.35);font-weight:700;}
.cb{background:#fff;border-bottom:1px solid var(--bdr);padding:5px 20px;display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--mut);}
.dot{width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block;}
.dot.ok{background:var(--grn);}.dot.er{background:var(--red);}
main{padding:20px;max-width:1400px;margin:0 auto;}
.pg{display:none;}.pg.on{display:block;}

/* STATS */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:20px;}
.sc{background:var(--card);border-radius:10px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:4px solid;text-align:center;}
.sc .n{font-size:2rem;font-weight:800;}.sc .l{font-size:.76rem;color:var(--mut);margin-top:3px;}
.sc-t{border-color:var(--blu);}.sc-t .n{color:var(--blu);}
.sc-p{border-color:var(--ylw);}.sc-p .n{color:var(--ylw);}
.sc-a{border-color:var(--org);}.sc-a .n{color:var(--org);}
.sc-c{border-color:var(--grn);}.sc-c .n{color:var(--grn);}
.sc-r{border-color:var(--red);}.sc-r .n{color:var(--red);}

/* CHARTS */
.cg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.cc{background:var(--card);border-radius:10px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.cc h3{font-size:.88rem;color:var(--mut);margin-bottom:12px;}
.bi{display:flex;align-items:center;margin-bottom:8px;gap:7px;font-size:.81rem;}
.bl{width:120px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bt{flex:1;height:15px;background:#f0f0f0;border-radius:8px;overflow:hidden;}
.bf{height:100%;border-radius:8px;transition:width .5s;}
.bv{width:20px;text-align:right;font-weight:700;}

/* ALERTS */
.ab{border-radius:8px;padding:11px 14px;margin-bottom:12px;border:1px solid;}
.ad{background:#fdecea;border-color:var(--red);}
.aw{background:#fff8e1;border-color:var(--ylw);}
.ab h4{font-size:.85rem;margin-bottom:5px;}
.ab ul{padding-left:16px;font-size:.8rem;line-height:1.8;}

/* FILTER */
.fb{background:var(--card);border-radius:10px;padding:13px 15px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:13px;display:flex;flex-wrap:wrap;gap:9px;align-items:flex-end;}
.fg{display:flex;flex-direction:column;gap:3px;flex:1;min-width:120px;}
.fg label{font-size:.73rem;font-weight:700;color:var(--mut);}
.fg input,.fg select{border:1px solid var(--bdr);border-radius:6px;padding:6px 9px;font-size:.82rem;font-family:inherit;}

/* TABLE */
.tw{background:var(--card);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:.82rem;}
th{background:#f8f9fa;padding:10px 12px;text-align:left;font-size:.73rem;color:var(--mut);font-weight:700;white-space:nowrap;}
td{padding:9px 12px;border-top:1px solid var(--bdr);vertical-align:middle;}
tr:hover td{background:#fafafa;}
tr.ov td{background:#fff5f5;}
tr.wa td{background:#fffbf0;}

/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:11px;font-size:.71rem;font-weight:700;white-space:nowrap;}
.ba{background:#fdecea;color:var(--red);}
.bm{background:#fff8e1;color:#c8860a;}
.bb{background:#eafaf1;color:var(--grn);}
.bp{background:#fff8e1;color:#c8860a;}
.ban{background:#fff3e0;color:var(--org);}
.bc{background:#eafaf1;color:var(--grn);}
.br{background:#fdecea;color:var(--red);}

/* FORM */
.fc{background:var(--card);border-radius:10px;padding:22px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.fc h2{font-size:1rem;margin-bottom:18px;color:var(--p);}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.fgr{display:flex;flex-direction:column;gap:4px;}
.fgr.full{grid-column:1/-1;}
.fgr label{font-size:.75rem;font-weight:700;color:var(--mut);}
.fgr input,.fgr select,.fgr textarea{border:1px solid var(--bdr);border-radius:7px;padding:8px 11px;font-size:.86rem;font-family:inherit;width:100%;}
.fgr input:focus,.fgr select:focus,.fgr textarea:focus{outline:none;border-color:var(--p);}
.fgr textarea{resize:vertical;min-height:72px;}
.fa{margin-top:16px;display:flex;gap:9px;}

/* DETAIL */
.dc{background:var(--card);border-radius:10px;padding:22px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
.df label{font-size:.73rem;color:var(--mut);font-weight:700;display:block;margin-bottom:2px;}
.df p{font-size:.88rem;}
.df.full{grid-column:1/-1;}

/* BUTTONS */
.btn{padding:7px 16px;border-radius:7px;border:none;cursor:pointer;font-size:.83rem;font-weight:600;transition:opacity .2s;display:inline-flex;align-items:center;gap:4px;}
.btn:hover{opacity:.85;}.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-p{background:var(--p);color:#fff;}
.btn-s{background:var(--grn);color:#fff;}
.btn-d{background:var(--red);color:#fff;}
.btn-n{background:#ecf0f1;color:var(--txt);}
.btn-i{background:var(--blu);color:#fff;}
.sm{padding:3px 8px;font-size:.74rem;}

.ldr{text-align:center;padding:36px;color:var(--mut);}
.sp{width:28px;height:28px;border:3px solid #eee;border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg);}}
@media(max-width:700px){.fg2,.cg,.dg{grid-template-columns:1fr;}.sg{grid-template-columns:repeat(3,1fr);}}
</style>
</head>
<body>
<header>
  <h1>🛡️ PGR – Plano de Ação &nbsp;<small style="font-weight:400;opacity:.75">Transportes Ardo Ltda</small></h1>
  <button class="nb on" id="nav-dashboard" onclick="goTo('dashboard')">Dashboard</button>
  <button class="nb" id="nav-lista" onclick="goTo('lista')">Ações</button>
  <button class="nb" id="nav-novo" onclick="abrirNovo()">+ Nova</button>
</header>
<div class="cb">
  <span class="dot" id="cdot"></span>
  <span id="ctxt">Conectando...</span>
  <span style="flex:1"></span>
  <button class="btn btn-n sm" onclick="sync()">🔄 Sincronizar</button>
</div>
<main>

<!-- DASHBOARD -->
<div class="pg on" id="pg-dashboard">
  <div class="sg">
    <div class="sc sc-t"><div class="n" id="st">–</div><div class="l">Total</div></div>
    <div class="sc sc-p"><div class="n" id="sp">–</div><div class="l">Pendentes</div></div>
    <div class="sc sc-a"><div class="n" id="sa">–</div><div class="l">Em Andamento</div></div>
    <div class="sc sc-c"><div class="n" id="sc">–</div><div class="l">Concluídas</div></div>
    <div class="sc sc-r"><div class="n" id="sr">–</div><div class="l">Atrasadas</div></div>
  </div>
  <div id="alrt"></div>
  <div class="cg">
    <div class="cc"><h3>📊 Por Prioridade</h3><div id="cprio"></div></div>
    <div class="cc"><h3>📊 Por Setor</h3><div id="cset"></div></div>
  </div>
</div>

<!-- LISTA -->
<div class="pg" id="pg-lista">
  <div class="fb">
    <div class="fg"><label for="fb-b">🔍 Busca</label><input id="fb-b" type="text" placeholder="Buscar..." oninput="renderTab()"></div>
    <div class="fg"><label for="fb-s">Setor</label><select id="fb-s" onchange="renderTab()"><option value="">Todos</option></select></div>
    <div class="fg"><label for="fb-r">Responsável</label><select id="fb-r" onchange="renderTab()"><option value="">Todos</option></select></div>
    <div class="fg"><label for="fb-st">Status</label>
      <select id="fb-st" onchange="renderTab()">
        <option value="">Todos</option><option>Pendente</option><option>Em Andamento</option><option>Concluído</option><option>Atrasado</option>
      </select>
    </div>
    <div class="fg"><label for="fb-p">Prioridade</label>
      <select id="fb-p" onchange="renderTab()">
        <option value="">Todas</option><option>Alta</option><option>Média</option><option>Baixa</option>
      </select>
    </div>
    <button class="btn btn-n sm" onclick="limFiltros()">✕</button>
  </div>
  <div class="tw">
    <table>
      <thead><tr><th>ID</th><th>Atividade</th><th>Setor</th><th>Responsável</th><th>Prazo</th><th>Prioridade</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody id="tb"><tr><td colspan="8"><div class="ldr"><div class="sp"></div>Carregando...</div></td></tr></tbody>
    </table>
  </div>
</div>

<!-- FORM -->
<div class="pg" id="pg-novo">
  <div class="fc">
    <h2 id="ftit">➕ Nova Ação</h2>
    <input type="hidden" id="eid">
    <div class="fg2">
      <div class="fgr full"><label for="fa">Atividade *</label><input id="fa" type="text" placeholder="Ex: Elaboração de Laudos Técnicos"></div>
      <div class="fgr full"><label for="fd">Descrição *</label><textarea id="fd" placeholder="Descreva a ação..."></textarea></div>
      <div class="fgr">
        <label for="fse">Setor *</label>
        <select id="fse">
          <option value="">Selecione...</option>
          <option>Administrativo</option><option>Almoxarifado</option><option>Borracharia</option>
          <option>Comercial</option><option>CPD</option><option>Faturamento</option>
          <option>Lavador</option><option>Limpeza</option><option>Logística</option>
          <option>Manobra</option><option>Manutenção</option><option>Portaria</option>
          <option>Segurança do Trabalho</option><option>Transporte</option>
          <option>Abastecimento</option><option>Toda a Empresa</option>
        </select>
      </div>
      <div class="fgr"><label for="fca">Cargo</label><input id="fca" type="text" placeholder="Ex: Mecânico"></div>
      <div class="fgr">
        <label for="fri">Risco</label>
        <select id="fri">
          <option value="">Selecione...</option>
          <option>Ruído contínuo ou intermitente</option><option>Vibração de corpo inteiro</option>
          <option>Vibração localizada mão e braço</option><option>Radiação não ionizante</option>
          <option>Umidade</option><option>Postura sentada por longos períodos</option>
          <option>Postura inadequada</option><option>Esforço físico</option>
          <option>Agentes biológicos</option><option>Benzeno</option><option>Óleo diesel</option>
          <option>Óleo mineral</option><option>Fumos metálicos</option>
          <option>Produtos domissanitários</option><option>Incêndio e explosão</option>
          <option>Choque elétrico</option><option>Trabalho em altura</option>
          <option>Condução de veículos</option><option>Queda de mesmo nível</option>
          <option>Batida contra</option><option>Queimaduras</option><option>Outros</option>
        </select>
      </div>
      <div class="fgr"><label for="fre">Responsável *</label><input id="fre" type="text" placeholder="Ex: ELAINE CRISTINA GUBERT"></div>
      <div class="fgr">
        <label for="fpr">Prioridade *</label>
        <select id="fpr"><option value="">Selecione...</option><option>Alta</option><option>Média</option><option>Baixa</option></select>
      </div>
      <div class="fgr"><label for="fdi">Data de Início</label><input id="fdi" type="date"></div>
      <div class="fgr"><label for="fpz">Prazo Final *</label><input id="fpz" type="date"></div>
      <div class="fgr">
        <label for="fst">Status *</label>
        <select id="fst"><option>Pendente</option><option>Em Andamento</option><option>Concluído</option><option>Atrasado</option></select>
      </div>
      <div class="fgr full"><label for="fob">Observações</label><textarea id="fob" placeholder="Observações adicionais..."></textarea></div>
    </div>
    <div class="fa">
      <button class="btn btn-p" id="bsv" onclick="salvar()">💾 Salvar</button>
      <button class="btn btn-n" onclick="goTo('lista')">Cancelar</button>
    </div>
  </div>
</div>

<!-- DETALHE -->
<div class="pg" id="pg-detalhe">
  <div class="dc">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <button class="btn btn-n sm" onclick="goTo('lista')">← Voltar</button>
      <h2 id="dtit" style="font-size:1rem;color:var(--p)"></h2>
    </div>
    <div id="dbdg" style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px"></div>
    <div class="dg" id="dgrd"></div>
    <div style="margin-top:18px;display:flex;gap:8px">
      <button class="btn btn-p sm" onclick="editarAcao(did)">✏️ Editar</button>
      <button class="btn btn-s sm" onclick="concluir(did,true)">✔ Concluir</button>
      <button class="btn btn-d sm" onclick="excluir(did,true)">🗑 Excluir</button>
    </div>
  </div>
</div>

</main>
<script>
const URL_GAS = 'https://script.google.com/macros/s/AKfycbyAfmIuBOtnELett966hwfOoo19xGxy3d2-KVtC7Aedz39NhGs40l5vAwjjVHFwgtfjbg/exec';

let ACOES = [];
let nid = 1;
let did = null;

// ── JSONP ──
function req(params) {
  return new Promise((res, rej) => {
    const cb = '_pgr' + Date.now();
    const to = setTimeout(() => { cleanup(); rej(new Error('Timeout')); }, 15000);
    function cleanup() { delete window[cb]; const s = document.getElementById(cb); if (s) s.remove(); }
    window[cb] = d => { clearTimeout(to); cleanup(); res(d); };
    const qs = Object.entries({ ...params, callback: cb })
      .map(([k, v]) => k + '=' + encodeURIComponent(typeof v === 'object' ? JSON.stringify(v) : v)).join('&');
    const s = document.createElement('script');
    s.id = cb;
    s.src = URL_GAS + '?' + qs;
    s.onerror = () => { clearTimeout(to); cleanup(); rej(new Error('Falha')); };
    document.head.appendChild(s);
  });
}

// ── SYNC ──
async function sync() {
  conn('', 'Conectando...');
  try {
    const j = await req({ action: 'getAll' });
    if (j.ok) {
      ACOES = (j.data.length > 1 ? j.data.slice(1) : []).map(r => ({
        id: r[0], atividade: r[1], descricao: r[2], setor: r[3], cargo: r[4],
        risco: r[5], responsavel: r[6], prioridade: r[7], dataInicio: r[8],
        prazoFinal: r[9], status: r[10], observacoes: r[11],
        dataCriacao: r[12], ultimaAtualizacao: r[13]
      })).filter(a => a.id);
      calcId();
    }
    conn('ok', 'Conectado ✓ — ' + ACOES.length + ' ação(ões)');
    ui();
  } catch (e) {
    conn('er', 'Erro de conexão – verifique o Apps Script e tente novamente');
  }
}
function conn(st, msg) {
  document.getElementById('cdot').className = 'dot' + (st === 'ok' ? ' ok' : st === 'er' ? ' er' : '');
  document.getElementById('ctxt').textContent = msg;
}
function calcId() { nid = ACOES.length ? Math.max(...ACOES.map(a => parseInt((a.id + '').replace('PGR-', '')) || 0)) + 1 : 1; }

// ── CRUD ──
async function salvar() {
  const id = g('eid');
  const a = {
    id: id || 'PGR-' + String(nid).padStart(3, '0'),
    atividade: v('fa'), descricao: v('fd'), setor: v('fse'), cargo: v('fca'),
    risco: v('fri'), responsavel: v('fre'), prioridade: v('fpr'),
    dataInicio: v('fdi'), prazoFinal: v('fpz'), status: v('fst'), observacoes: v('fob'),
    dataCriacao: id ? (ACOES.find(x => x.id === id) || {}).dataCriacao || hj() : hj(),
    ultimaAtualizacao: hj()
  };
  if (!a.atividade || !a.setor || !a.responsavel || !a.prioridade || !a.prazoFinal) {
    alert('Preencha os campos obrigatórios (*)'); return;
  }
  const btn = document.getElementById('bsv');
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    const row = toRow(a);
    if (id) {
      await req({ action: 'update', id, row: JSON.stringify(row) });
      const i = ACOES.findIndex(x => x.id === id);
      if (i >= 0) ACOES[i] = a;
    } else {
      await req({ action: 'add', row: JSON.stringify(row) });
      ACOES.push(a); nid++;
    }
    ui(); limForm(); goTo('lista');
  } catch (e) { alert('Erro ao salvar. Tente novamente.'); }
  btn.disabled = false; btn.textContent = '💾 Salvar';
}

async function excluir(id, voltar = false) {
  if (!confirm('Excluir esta ação?')) return;
  try {
    await req({ action: 'delete', id });
    ACOES = ACOES.filter(a => a.id !== id);
    ui(); if (voltar) goTo('lista');
  } catch (e) { alert('Erro ao excluir.'); }
}

async function concluir(id, refresh = false) {
  const a = ACOES.find(x => x.id === id); if (!a) return;
  a.status = 'Concluído'; a.ultimaAtualizacao = hj();
  try {
    await req({ action: 'update', id, row: JSON.stringify(toRow(a)) });
    ui(); if (refresh) verDet(id);
  } catch (e) { alert('Erro ao concluir.'); }
}

function toRow(a) { return [a.id,a.atividade,a.descricao,a.setor,a.cargo,a.risco,a.responsavel,a.prioridade,a.dataInicio,a.prazoFinal,a.status,a.observacoes,a.dataCriacao,a.ultimaAtualizacao]; }

// ── UI ──
function ui() {
  const now = new Date(); now.setHours(0,0,0,0);
  ACOES.forEach(a => { if (a.status !== 'Concluído' && a.prazoFinal && new Date(a.prazoFinal + 'T00:00:00') < now) a.status = 'Atrasado'; });
  dash(); renderTab(); filtros();
}

function dash() {
  const t=ACOES.length, pe=ct('Pendente'), an=ct('Em Andamento'), co=ct('Concluído'), at=ct('Atrasado');
  ['st','sp','sa','sc','sr'].forEach((id,i)=>document.getElementById(id).textContent=[t,pe,an,co,at][i]);
  alertas();
  bar('cprio',[{l:'Alta',v:ct2('prioridade','Alta'),c:'#e74c3c'},{l:'Média',v:ct2('prioridade','Média'),c:'#f39c12'},{l:'Baixa',v:ct2('prioridade','Baixa'),c:'#27ae60'}]);
  const sm={}; ACOES.forEach(a=>{sm[a.setor]=(sm[a.setor]||0)+1;});
  const cls=['#2980b9','#8e44ad','#16a085','#e67e22','#c0392b','#27ae60','#d35400','#2c3e50'];
  bar('cset',Object.entries(sm).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([l,v],i)=>({l,v,c:cls[i%8]})));
}

function alertas() {
  const now=new Date(); now.setHours(0,0,0,0);
  const e10=new Date(now); e10.setDate(e10.getDate()+10);
  const atr=ACOES.filter(a=>a.status==='Atrasado');
  const prx=ACOES.filter(a=>{ if(a.status==='Concluído'||a.status==='Atrasado'||!a.prazoFinal) return false; const p=new Date(a.prazoFinal+'T00:00:00'); return p>=now&&p<=e10; });
  let h='';
  if(atr.length) h+=`<div class="ab ad"><h4>🚨 ${atr.length} ação(ões) com prazo vencido</h4><ul>${atr.map(a=>`<li><b>${a.id}</b> – ${ex(a.atividade)} (${fm(a.prazoFinal)})</li>`).join('')}</ul></div>`;
  if(prx.length) h+=`<div class="ab aw"><h4>⚠️ ${prx.length} ação(ões) vencem em até 10 dias</h4><ul>${prx.map(a=>`<li><b>${a.id}</b> – ${ex(a.atividade)} (${fm(a.prazoFinal)})</li>`).join('')}</ul></div>`;
  document.getElementById('alrt').innerHTML=h;
}

function bar(id, data) {
  const mx=Math.max(...data.map(d=>d.v),1);
  document.getElementById(id).innerHTML=data.map(d=>`<div class="bi"><span class="bl" title="${d.l}">${d.l}</span><div class="bt"><div class="bf" style="width:${(d.v/mx)*100}%;background:${d.c}"></div></div><span class="bv">${d.v}</span></div>`).join('')||'<p style="color:var(--mut);font-size:.8rem">Sem dados</p>';
}

function renderTab() {
  const now=new Date(); now.setHours(0,0,0,0);
  const e10=new Date(now); e10.setDate(e10.getDate()+10);
  const bu=document.getElementById('fb-b').value.toLowerCase();
  const fs=document.getElementById('fb-s').value, fr=document.getElementById('fb-r').value;
  const fst=document.getElementById('fb-st').value, fp=document.getElementById('fb-p').value;
  const fil=ACOES.filter(a=>{
    if(fs&&a.setor!==fs) return false;
    if(fr&&a.responsavel!==fr) return false;
    if(fst&&a.status!==fst) return false;
    if(fp&&a.prioridade!==fp) return false;
    if(bu&&!Object.values(a).join(' ').toLowerCase().includes(bu)) return false;
    return true;
  });
  const tb=document.getElementById('tb');
  if(!fil.length){tb.innerHTML='<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--mut)">Nenhuma ação encontrada.</td></tr>';return;}
  tb.innerHTML=fil.map(a=>{
    const p=a.prazoFinal?new Date(a.prazoFinal+'T00:00:00'):null;
    const ov=p&&p<now&&a.status!=='Concluído', wa=p&&p>=now&&p<=e10&&a.status!=='Concluído';
    return `<tr class="${ov?'ov':wa?'wa':''}">
      <td><b>${a.id}</b></td>
      <td style="max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${ex(a.atividade)}">${ex(a.atividade)}</td>
      <td>${ex(a.setor)}</td><td>${ex(a.responsavel)}</td>
      <td>${p?`<span style="color:${ov?'var(--red)':wa?'var(--org)':'inherit'}">${fm(a.prazoFinal)}${ov?' ⚠️':wa?' ⏰':''}</span>`:'–'}</td>
      <td><span class="badge ${pk(a.prioridade)}">${a.prioridade}</span></td>
      <td><span class="badge ${sk(a.status)}">${a.status}</span></td>
      <td style="white-space:nowrap">
        <button class="btn btn-i sm" onclick="verDet('${a.id}')">👁</button>
        <button class="btn btn-p sm" onclick="editarAcao('${a.id}')">✏️</button>
        <button class="btn btn-s sm" onclick="concluir('${a.id}')">✔</button>
        <button class="btn btn-d sm" onclick="excluir('${a.id}')">🗑</button>
      </td></tr>`;
  }).join('');
}

function filtros() {
  const ss=[...new Set(ACOES.map(a=>a.setor).filter(Boolean))].sort();
  const rs=[...new Set(ACOES.map(a=>a.responsavel).filter(Boolean))].sort();
  const fs=document.getElementById('fb-s'), fr=document.getElementById('fb-r');
  const sv=fs.value, rv=fr.value;
  fs.innerHTML='<option value="">Todos</option>'+ss.map(s=>`<option>${ex(s)}</option>`).join('');
  fr.innerHTML='<option value="">Todos</option>'+rs.map(r=>`<option>${ex(r)}</option>`).join('');
  fs.value=sv; fr.value=rv;
}

function verDet(id) {
  const a=ACOES.find(x=>x.id===id); if(!a) return;
  did=id;
  document.getElementById('dtit').textContent=`${a.id} – ${a.atividade}`;
  document.getElementById('dbdg').innerHTML=`<span class="badge ${pk(a.prioridade)}">Prioridade: ${a.prioridade}</span><span class="badge ${sk(a.status)}">${a.status}</span>`;
  const cs=[['Setor',a.setor],['Cargo',a.cargo],['Risco',a.risco],['Responsável',a.responsavel],['Data Início',fm(a.dataInicio)],['Prazo Final',fm(a.prazoFinal)],['Data Criação',fm(a.dataCriacao)],['Última Atualização',fm(a.ultimaAtualizacao)],['Descrição',a.descricao,1],['Observações',a.observacoes,1]];
  document.getElementById('dgrd').innerHTML=cs.map(([l,vl,f])=>`<div class="df${f?' full':''}"><label>${l}</label><p>${ex(vl)||'–'}</p></div>`).join('');
  goTo('detalhe');
}

function editarAcao(id) {
  const a=ACOES.find(x=>x.id===id); if(!a) return;
  document.getElementById('ftit').textContent=`✏️ Editar – ${id}`;
  document.getElementById('eid').value=id;
  sv('fa',a.atividade); sv('fd',a.descricao); sv('fse',a.setor); sv('fca',a.cargo);
  sv('fri',a.risco); sv('fre',a.responsavel); sv('fpr',a.prioridade);
  sv('fdi',a.dataInicio); sv('fpz',a.prazoFinal); sv('fst',a.status); sv('fob',a.observacoes);
  goTo('novo');
}

function abrirNovo() { limForm(); goTo('novo'); }
function limForm() {
  document.getElementById('eid').value='';
  document.getElementById('ftit').textContent='➕ Nova Ação';
  ['fa','fd','fca','fre','fdi','fpz','fob'].forEach(id=>sv(id,''));
  ['fse','fri','fpr'].forEach(id=>{document.getElementById(id).selectedIndex=0;});
  sv('fst','Pendente');
}
function limFiltros() {
  ['fb-b','fb-s','fb-r','fb-st','fb-p'].forEach(id=>{const e=document.getElementById(id);e.tagName==='INPUT'?e.value='':e.value='';});
  renderTab();
}

// ── NAV ──
function goTo(p) {
  document.querySelectorAll('.pg').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(e=>e.classList.remove('on'));
  document.getElementById('pg-'+p).classList.add('on');
  const n=document.getElementById('nav-'+p); if(n) n.classList.add('on');
}

// ── HELPERS ──
function hj(){ return new Date().toISOString().split('T')[0]; }
function fm(d){ if(!d||d==='–') return '–'; try{ const [y,m,dy]=String(d).split('-'); return `${dy}/${m}/${y}`; }catch(e){return d||'–';} }
function ex(s){ return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''; }
function v(id){ return (document.getElementById(id).value||'').trim(); }
function g(id){ return document.getElementById(id).value; }
function sv(id,val){ const e=document.getElementById(id); if(!e) return; e.value=val||''; }
function ct(st){ return ACOES.filter(a=>a.status===st).length; }
function ct2(k,vl){ return ACOES.filter(a=>a[k]===vl).length; }
function pk(p){ return {Alta:'ba',Média:'bm',Baixa:'bb'}[p]||'bb'; }
function sk(s){ return {'Pendente':'bp','Em Andamento':'ban','Concluído':'bc','Atrasado':'br'}[s]||'bp'; }

window.onload = sync;
</script>
