<script>
// ===================== CONFIG =====================
// Cole aqui a URL do seu Google Apps Script Web App:
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyAfmIuBOtnELett966hwfOoo19xGxy3d2-KVtC7Aedz39NhGs40l5vAwjjVHFwgtfjbg/exec';

// ===================== STATE =====================
let ACOES = [];
let nextId = 1;
let detalheId = null;

// ===================== JSONP =====================
function jsonpReq(params) {
  return new Promise((resolve, reject) => {
    const cb = 'pgr_' + Date.now();
    const to = setTimeout(() => { cleanup(); reject(new Error('Timeout')); }, 12000);
    function cleanup() { delete window[cb]; const s = document.getElementById(cb); if(s) s.remove(); }
    window[cb] = d => { clearTimeout(to); cleanup(); resolve(d); };
    const qs = Object.entries({...params, callback: cb})
      .map(([k,v]) => k + '=' + encodeURIComponent(typeof v === 'object' ? JSON.stringify(v) : v)).join('&');
    const s = document.createElement('script');
    s.id = cb;
    s.src = SCRIPT_URL + '?' + qs;
    s.onerror = () => { clearTimeout(to); cleanup(); reject(new Error('Erro no script')); };
    document.head.appendChild(s);
  });
}

// ===================== SYNC =====================
async function syncData() {
  setConn('…', 'Conectando ao Google Sheets...');
  try {
    const j = await jsonpReq({ action: 'getAll' });
    if (j.ok) {
      ACOES = (j.data.length > 1 ? j.data.slice(1) : []).map(r => ({
        id:r[0], atividade:r[1], descricao:r[2], setor:r[3], cargo:r[4],
        risco:r[5], responsavel:r[6], prioridade:r[7], dataInicio:r[8],
        prazoFinal:r[9], status:r[10], observacoes:r[11],
        dataCriacao:r[12], ultimaAtualizacao:r[13]
      })).filter(a => a.id);
      calcNextId();
    }
    setConn('ok', 'Conectado ao Google Sheets ✓ — ' + ACOES.length + ' ação(ões)');
    atualizarUI();
  } catch(e) {
    setConn('err', 'Erro de conexão – verifique a URL no topo do código');
  }
}

function setConn(st, msg) {
  document.getElementById('conn-dot').className = 'dot' + (st==='ok'?' ok':st==='err'?' err':'');
  document.getElementById('conn-txt').textContent = msg;
}
function calcNextId() { nextId = ACOES.length ? Math.max(...ACOES.map(a=>parseInt(a.id?.replace('PGR-',''))||0)) + 1 : 1; }

// ===================== CRUD =====================
async function salvarAcao() {
  const id = document.getElementById('edit-id').value;
  const a = {
    id: id || 'PGR-' + String(nextId).padStart(3,'0'),
    atividade:   v('f-atividade'),
    descricao:   v('f-desc'),
    setor:       v('f-setor-f'),
    cargo:       v('f-cargo'),
    risco:       v('f-risco'),
    responsavel: v('f-resp-f'),
    prioridade:  v('f-prio-f'),
    dataInicio:  v('f-inicio'),
    prazoFinal:  v('f-prazo'),
    status:      v('f-status-f'),
    observacoes: v('f-obs'),
    dataCriacao: id ? (ACOES.find(x=>x.id===id)||{}).dataCriacao||today() : today(),
    ultimaAtualizacao: today()
  };
  if (!a.atividade||!a.setor||!a.responsavel||!a.prioridade||!a.prazoFinal) { alert('Preencha os campos obrigatórios (*)'); return; }
  const btn = document.getElementById('btn-salvar');
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    const row = toRow(a);
    if (id) {
      await jsonpReq({ action:'update', id, row: JSON.stringify(row) });
      const i = ACOES.findIndex(x=>x.id===id);
      if (i>=0) ACOES[i] = a;
    } else {
      await jsonpReq({ action:'add', row: JSON.stringify(row) });
      ACOES.push(a); nextId++;
    }
    atualizarUI();
    limparForm();
    showPage('lista');
  } catch(e) { alert('Erro ao salvar. Tente novamente.'); }
  btn.disabled = false; btn.textContent = '💾 Salvar';
}

async function excluirAcao(id, irParaLista=false) {
  if (!confirm('Excluir esta ação permanentemente?')) return;
  try {
    await jsonpReq({ action:'delete', id });
    ACOES = ACOES.filter(a=>a.id!==id);
    atualizarUI();
    if (irParaLista) showPage('lista');
  } catch(e) { alert('Erro ao excluir.'); }
}

async function concluirAcao(id, refresh=false) {
  const a = ACOES.find(x=>x.id===id); if(!a) return;
  a.status = 'Concluído'; a.ultimaAtualizacao = today();
  try {
    await jsonpReq({ action:'update', id, row: JSON.stringify(toRow(a)) });
    atualizarUI();
    if (refresh) verDetalhe(id);
  } catch(e) { alert('Erro ao concluir.'); }
}

function toRow(a) { return [a.id,a.atividade,a.descricao,a.setor,a.cargo,a.risco,a.responsavel,a.prioridade,a.dataInicio,a.prazoFinal,a.status,a.observacoes,a.dataCriacao,a.ultimaAtualizacao]; }

// ===================== UI =====================
function atualizarUI() {
  const now = new Date(); now.setHours(0,0,0,0);
  ACOES.forEach(a => {
    if (a.status!=='Concluído' && a.prazoFinal) {
      if (new Date(a.prazoFinal+'T00:00:00') < now) a.status = 'Atrasado';
    }
  });
  renderDash(); renderTabela(); popularFiltros();
}

function renderDash() {
  const t=ACOES.length, pe=cnt('Pendente'), an=cnt('Em Andamento'), co=cnt('Concluído'), at=cnt('Atrasado');
  set('s-total',t); set('s-pend',pe); set('s-and',an); set('s-conc',co); set('s-atr',at);
  renderAlertas();
  renderBar('chart-prio',[{l:'Alta',v:cnt2('prioridade','Alta'),c:'#e74c3c'},{l:'Média',v:cnt2('prioridade','Média'),c:'#f39c12'},{l:'Baixa',v:cnt2('prioridade','Baixa'),c:'#27ae60'}]);
  const sm={}; ACOES.forEach(a=>{sm[a.setor]=(sm[a.setor]||0)+1;});
  const cols=['#2980b9','#8e44ad','#16a085','#e67e22','#c0392b','#27ae60','#d35400','#2c3e50'];
  renderBar('chart-setor', Object.entries(sm).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([l,v],i)=>({l,v,c:cols[i%8]})));
}

function renderAlertas() {
  const now=new Date(); now.setHours(0,0,0,0);
  const em10=new Date(now); em10.setDate(em10.getDate()+10);
  const atr=ACOES.filter(a=>a.status==='Atrasado');
  const prx=ACOES.filter(a=>{ if(a.status==='Concluído'||a.status==='Atrasado'||!a.prazoFinal) return false; const p=new Date(a.prazoFinal+'T00:00:00'); return p>=now&&p<=em10; });
  let h='';
  if(atr.length) h+=`<div class="alert-box alert-danger"><h4>🚨 ${atr.length} ação(ões) com prazo vencido</h4><ul>${atr.map(a=>`<li><b>${a.id}</b> – ${esc(a.atividade)} (prazo: ${fmt(a.prazoFinal)})</li>`).join('')}</ul></div>`;
  if(prx.length) h+=`<div class="alert-box alert-warn"><h4>⚠️ ${prx.length} ação(ões) vencem em até 10 dias</h4><ul>${prx.map(a=>`<li><b>${a.id}</b> – ${esc(a.atividade)} (prazo: ${fmt(a.prazoFinal)})</li>`).join('')}</ul></div>`;
  document.getElementById('alertas').innerHTML=h;
}

function renderBar(id, data) {
  const mx=Math.max(...data.map(d=>d.v),1);
  document.getElementById(id).innerHTML = data.length
    ? data.map(d=>`<div class="bar-item"><span class="bar-label" title="${d.l}">${d.l}</span><div class="bar-track"><div class="bar-fill" style="width:${(d.v/mx)*100}%;background:${d.c}"></div></div><span class="bar-val">${d.v}</span></div>`).join('')
    : '<p style="color:var(--muted);font-size:.83rem">Sem dados</p>';
}

function renderTabela() {
  const now=new Date(); now.setHours(0,0,0,0);
  const em10=new Date(now); em10.setDate(em10.getDate()+10);
  const busca=document.getElementById('f-busca').value.toLowerCase();
  const fs=document.getElementById('f-setor').value, fr=document.getElementById('f-resp').value;
  const fst=document.getElementById('f-status').value, fp=document.getElementById('f-prio').value;
  const fil=ACOES.filter(a=>{
    if(fs&&a.setor!==fs) return false;
    if(fr&&a.responsavel!==fr) return false;
    if(fst&&a.status!==fst) return false;
    if(fp&&a.prioridade!==fp) return false;
    if(busca&&!Object.values(a).join(' ').toLowerCase().includes(busca)) return false;
    return true;
  });
  const tb=document.getElementById('tbody');
  if(!fil.length){tb.innerHTML='<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--muted)">Nenhuma ação encontrada.</td></tr>';return;}
  tb.innerHTML=fil.map(a=>{
    const p=a.prazoFinal?new Date(a.prazoFinal+'T00:00:00'):null;
    const ov=p&&p<now&&a.status!=='Concluído', wa=p&&p>=now&&p<=em10&&a.status!=='Concluído';
    return `<tr class="${ov?'row-overdue':wa?'row-warn':''}">
      <td><b>${a.id}</b></td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(a.atividade)}">${esc(a.atividade)}</td>
      <td>${esc(a.setor)}</td><td>${esc(a.responsavel)}</td>
      <td>${p?`<span style="color:${ov?'var(--red)':wa?'var(--orange)':'inherit'}">${fmt(a.prazoFinal)}${ov?' ⚠️':wa?' ⏰':''}</span>`:'–'}</td>
      <td><span class="badge b-${pKey(a.prioridade)}">${a.prioridade}</span></td>
      <td><span class="badge b-${sKey(a.status)}">${a.status}</span></td>
      <td style="white-space:nowrap">
        <button class="btn btn-info btn-sm" onclick="verDetalhe('${a.id}')">👁</button>
        <button class="btn btn-primary btn-sm" onclick="editarAcao('${a.id}')">✏️</button>
        <button class="btn btn-success btn-sm" onclick="concluirAcao('${a.id}')">✔</button>
        <button class="btn btn-danger btn-sm" onclick="excluirAcao('${a.id}')">🗑</button>
      </td></tr>`;
  }).join('');
}

function popularFiltros() {
  const setores=[...new Set(ACOES.map(a=>a.setor).filter(Boolean))].sort();
  const resps=[...new Set(ACOES.map(a=>a.responsavel).filter(Boolean))].sort();
  const fs=document.getElementById('f-setor'), fr=document.getElementById('f-resp');
  const sv=fs.value, rv=fr.value;
  fs.innerHTML='<option value="">Todos</option>'+setores.map(s=>`<option>${esc(s)}</option>`).join('');
  fr.innerHTML='<option value="">Todos</option>'+resps.map(r=>`<option>${esc(r)}</option>`).join('');
  fs.value=sv; fr.value=rv;
}

function verDetalhe(id) {
  const a=ACOES.find(x=>x.id===id); if(!a) return;
  detalheId=id;
  document.getElementById('det-titulo').textContent=`${a.id} – ${a.atividade}`;
  document.getElementById('det-badges').innerHTML=`<span class="badge b-${pKey(a.prioridade)}">Prioridade: ${a.prioridade}</span><span class="badge b-${sKey(a.status)}">${a.status}</span>`;
  const campos=[['Setor',a.setor],['Cargo',a.cargo],['Risco',a.risco],['Responsável',a.responsavel],['Data Início',fmt(a.dataInicio)],['Prazo Final',fmt(a.prazoFinal)],['Data Criação',fmt(a.dataCriacao)],['Última Atualização',fmt(a.ultimaAtualizacao)],['Descrição',a.descricao,true],['Observações',a.observacoes,true]];
  document.getElementById('det-grid').innerHTML=campos.map(([l,vl,f])=>`<div class="detail-field${f?' full':''}"><label>${l}</label><p>${esc(vl)||'–'}</p></div>`).join('');
  showPage('detalhe');
}

function editarAcao(id) {
  const a=ACOES.find(x=>x.id===id); if(!a) return;
  document.getElementById('form-titulo').textContent=`✏️ Editar – ${id}`;
  document.getElementById('edit-id').value=id;
  sv('f-atividade',a.atividade); sv('f-desc',a.descricao); sv('f-setor-f',a.setor);
  sv('f-cargo',a.cargo); sv('f-risco',a.risco); sv('f-resp-f',a.responsavel);
  sv('f-prio-f',a.prioridade); sv('f-inicio',a.dataInicio); sv('f-prazo',a.prazoFinal);
  sv('f-status-f',a.status); sv('f-obs',a.observacoes);
  showPage('novo');
}

function abrirNovo() { limparForm(); showPage('novo'); }
function limparForm() {
  document.getElementById('edit-id').value='';
  document.getElementById('form-titulo').textContent='➕ Nova Ação';
  ['f-atividade','f-desc','f-cargo','f-resp-f','f-inicio','f-prazo','f-obs'].forEach(id=>sv(id,''));
  ['f-setor-f','f-risco','f-prio-f'].forEach(id=>{ document.getElementById(id).selectedIndex=0; });
  sv('f-status-f','Pendente');
}
function limparFiltros() {
  ['f-busca','f-setor','f-resp','f-status','f-prio'].forEach(id=>{ const e=document.getElementById(id); e.tagName==='INPUT'?e.value='':e.value=''; });
  renderTabela();
}

// ===================== NAV =====================
function showPage(p) {
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(e=>e.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  const n=document.getElementById('nav-'+p); if(n) n.classList.add('active');
}

// ===================== HELPERS =====================
function today(){ return new Date().toISOString().split('T')[0]; }
function fmt(d){ if(!d||d==='–') return '–'; try{ const [y,m,dy]=String(d).split('-'); return `${dy}/${m}/${y}`; }catch(e){return d;} }
function esc(s){ return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''; }
function v(id){ return document.getElementById(id).value.trim(); }
function sv(id,val){ const e=document.getElementById(id); if(e){ e.tagName==='SELECT'? (e.value=val): (e.value=val||''); } }
function set(id,val){ document.getElementById(id).textContent=val; }
function cnt(st){ return ACOES.filter(a=>a.status===st).length; }
function cnt2(k,vl){ return ACOES.filter(a=>a[k]===vl).length; }
function pKey(p){ return {Alta:'alta',Média:'media',Baixa:'baixa'}[p]||'baixa'; }
function sKey(s){ return {Pendente:'pendente','Em Andamento':'andamento',Concluído:'concluido',Atrasado:'atrasado'}[s]||'pendente'; }

// ===================== START =====================
window.onload = syncData;
</script>
