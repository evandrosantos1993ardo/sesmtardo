    <style>
        @media print {

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #c94b4b 100%);
            min-height: 100vh;

        }

        .container {
            max-width: 900px;
            margin: 0 auto;

            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);

            padding: 30px;
            text-align: center;
        }

        header img { max-width: 280px; height: auto; margin-bottom: 15px; }
        header h1 { font-size: 24px; margin-bottom: 6px; }
        header p { opacity: 0.85; font-size: 14px; }

        .content { padding: 35px; }

        .step { display: none; }
        .step.active { display: block; }

        .section-title {
            color: #1e3c72;

        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;

        }

        .form-group input,
        .form-group select,
        .form-group textarea {

        .form-group textarea:focus {

        .btn {

        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(30,60,114,0.4); }

        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { box-shadow: 0 10px 25px rgba(108,117,125,0.4); }

        .btn-danger { background: linear-gradient(135deg, #c94b4b, #a03030); }
        .btn-danger:hover { box-shadow: 0 10px 25px rgba(201,75,75,0.4); }

        .navigation {

        /* ===== DOCUMENTO PDF ===== */

            background: white;

        .doc-header {
            text-align: center;

            border-bottom: 2px solid #1e3c72;
        }

        .doc-title {
            font-size: 14pt;
            color: #1e3c72;
            font-weight: bold;
            margin-top: 6px;

        .doc-section {
            margin-bottom: 10px;
            border: 1px solid #dde2ea;
            border-radius: 3px;

        .doc-section-title {

            padding: 6px 8px;

            border-right: 1px solid #dde2ea;
        }

        .doc-info-cell:last-child { border-right: none; }

        .doc-info-label { font-weight: bold; color: #1e3c72; font-size: 8pt; display: block; margin-bottom: 2px; }

        .doc-content {
            white-space: pre-wrap;

            font-size: 9.5pt;

        .signature-area {
            display: grid;

        .signature-box {
            text-align: center;

        }

        .signature-line {
            border-top: 1px solid #333;

            padding-top: 4px;

        .logo-pdf {
            width: 75mm;
            height: auto;
            display: block;
            margin: 0 auto 8px auto;
        }

        .preview-actions {
            text-align: center;
            padding: 20px 0 10px;
        }

        .alert-required {
            color: #c94b4b;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .form-group.error input,
        .form-group.error textarea,
        .form-group.error select {
            border-color: #c94b4b;
        }

        .form-group.error .alert-required { display: block; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <img src="imagem/LogoArdo70anos.png" alt="Logo TransArdo" onerror="this.style.display='none'">
        <h1>Termo de Orientação</h1>
        <p>TransArdo – Gestão de Documentos</p>
    </header>

    <div class="content">

        <!-- STEP 1: Formulário -->
        <div class="step active" id="step1">
            <h2 class="section-title">📋 Preencha os Dados da Orientação</h2>

            <div class="form-row">
                <div class="form-group" id="fg-nome">
                    <label for="nome">Nome do Funcionário *</label>
                    <input type="text" id="nome" placeholder="Nome completo do funcionário">
                    <span class="alert-required">Campo obrigatório</span>
                </div>
                <div class="form-group" id="fg-setor">
                    <label for="setor">Setor *</label>
                    <input type="text" id="setor" placeholder="Ex: Logística, Manutenção...">
                    <span class="alert-required">Campo obrigatório</span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" id="fg-responsavel">
                    <label for="responsavel">Responsável pelo Setor *</label>
                    <input type="text" id="responsavel" placeholder="Nome e cargo do responsável">
                    <span class="alert-required">Campo obrigatório</span>
                </div>
                <div class="form-group">
                    <label for="cargo">Cargo do Funcionário</label>
                    <input type="text" id="cargo" placeholder="Ex: Motorista, Auxiliar...">
                </div>
            </div>

            <div class="form-group" id="fg-descricao">
                <label for="descricao">Descrição da Orientação *</label>
                <textarea id="descricao" rows="3" placeholder="Descreva brevemente o motivo da orientação (ex: Velocidade acima do permitido)"></textarea>
                <span class="alert-required">Campo obrigatório</span>
            </div>

            <div class="form-group" id="fg-justificativa">
                <label for="justificativa">Justificativa para a Orientação *</label>
                <textarea id="justificativa" rows="7" placeholder="Descreva detalhadamente a justificativa, consequências, normas e orientações fornecidas ao funcionário..."></textarea>
                <span class="alert-required">Campo obrigatório</span>
            </div>

            <div class="form-group">
                <label for="localData">Local e Data</label>
                <input type="text" id="localData" placeholder="Ex: Carambeí, 06 de janeiro de 2026">
            </div>

            <div class="navigation">
                <div></div>
                <button class="btn" onclick="gerarDocumento()">Gerar Termo de Orientação →</button>
            </div>
        </div>

        <!-- STEP 2: Preview do Documento -->
        <div class="step" id="step2">
            <div class="preview-actions no-print">
                <button class="btn btn-secondary" onclick="voltarFormulario()">← Editar Dados</button>
                <button class="btn btn-danger" onclick="gerarPDF()">⬇ Baixar PDF</button>
                <button class="btn" onclick="window.print()">🖨 Imprimir</button>
            </div>

            <div id="documentoConteudo"></div>

            <div class="preview-actions no-print" style="padding-bottom:20px;">
                <button class="btn btn-secondary" onclick="voltarFormulario()">← Editar Dados</button>
                <button class="btn btn-danger" onclick="gerarPDF()">⬇ Baixar PDF</button>
                <button class="btn" onclick="window.print()">🖨 Imprimir</button>
            </div>
        </div>

    </div>
</div>

<script>
    function mostrarStep(n) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('step' + n).classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function voltarFormulario() {
        mostrarStep(1);
    }

    function validarCampo(id) {
        const el = document.getElementById(id);
        const fg = document.getElementById('fg-' + id);
        if (!fg) return true;
        if (!el.value.trim()) {
            fg.classList.add('error');
            return false;
        }
        fg.classList.remove('error');
        return true;
    }

    function gerarDocumento() {
        const v1 = validarCampo('nome');
        const v2 = validarCampo('setor');
        const v3 = validarCampo('responsavel');
        const v4 = validarCampo('descricao');
        const v5 = validarCampo('justificativa');

        if (!v1 || !v2 || !v3 || !v4 || !v5) {
            const firstError = document.querySelector('.form-group.error input, .form-group.error textarea');
            if (firstError) firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }

        const nome        = document.getElementById('nome').value.trim();
        const setor       = document.getElementById('setor').value.trim();
        const responsavel = document.getElementById('responsavel').value.trim();
        const cargo       = document.getElementById('cargo').value.trim();
        const descricao   = document.getElementById('descricao').value.trim();
        const justificativa = document.getElementById('justificativa').value.trim();
        const localData   = document.getElementById('localData').value.trim() ||
                            'Carambeí, ' + new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });

        const html = `
        <div class="documento">

            <div class="doc-header no-split">
                ${logoPDF()}
                <div class="doc-title">TERMO DE ORIENTAÇÃO</div>
            </div>

            <div class="doc-section no-split">
                <div class="doc-section-title">DADOS DO FUNCIONÁRIO E DO SETOR</div>
                <div class="doc-info-grid">
                    <div class="doc-info-cell">
                        <span class="doc-info-label">Funcionário:</span>
                        <strong>${nome.toUpperCase()}</strong>${cargo ? ' – ' + cargo : ''}
                    </div>
                    <div class="doc-info-cell">
                        <span class="doc-info-label">Setor:</span>
                        ${setor}
                    </div>
                </div>
                <div style="border-top:1px solid #dde2ea;">
                    <div class="doc-info-cell">
                        <span class="doc-info-label">Responsável pelo Setor:</span>
                        ${responsavel}
                    </div>
                </div>
            </div>

            <div class="doc-section no-split">
                <div class="doc-section-title">DESCRIÇÃO DA ORIENTAÇÃO</div>
                <div class="doc-section-body">
                    <p class="doc-content">${escapeHtml(descricao)}</p>
                </div>
            </div>

            <div class="doc-section no-split">
                <div class="doc-section-title">JUSTIFICATIVA PARA A ORIENTAÇÃO</div>
                <div class="doc-section-body">
                    <p class="doc-content">${escapeHtml(justificativa)}</p>
                </div>
            </div>

            <div class="doc-section no-split">
                <div class="doc-section-title">ASSINATURAS</div>
                <div class="doc-section-body">
                    <p style="text-align:center; margin-bottom:10px; font-size:9pt;">${escapeHtml(localData)}</p>
                    <div class="signature-area">
                        <div class="signature-box">
                            <div class="signature-line">___________________________</div>
                            <strong>${escapeHtml(responsavel.split('\n')[0])}</strong><br>
                            Responsável pelo Setor
                        </div>
                        <div class="signature-box">
                            <div class="signature-line">___________________________</div>
                            <strong>Evandro dos Santos</strong><br>
                            Tec. Segurança do Trabalho
                        </div>
                        <div class="signature-box">
                            <div class="signature-line">___________________________</div>
                            <strong>${escapeHtml(nome.toUpperCase())}</strong><br>
                            Funcionário
                        </div>
                    </div>
                </div>
            </div>

        </div>`;

        document.getElementById('documentoConteudo').innerHTML = html;
        mostrarStep(2);
    }

    function escapeHtml(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function logoPDF() {
        return `<img src="imagem/LogoArdo70anos.png" alt="Logo TransArdo" class="logo-pdf" onerror="this.style.display='none'">`;
    }

    function gerarPDF() {
        const nome = document.getElementById('nome').value.trim().toLowerCase().replace(/\s+/g, '-');
        const elemento = document.getElementById('documentoConteudo');

        html2pdf().set({
            margin: [12, 12, 12, 12],
            filename: `termo-orientacao-${nome}.pdf`,
            image: { type: 'jpeg', quality: 0.95 },
            html2canvas: { scale: 1.5, useCORS: true, scrollX: 0, scrollY: 0 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['css'], avoid: '.no-split' }
        }).from(elemento).save();
    }
</script>
</body>
</html>
